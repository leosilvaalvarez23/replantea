<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos y tasas · Viviendas y Proyectos</title>
<link rel="icon" type="image/svg+xml" href="/app/img/icono-vyp.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#EBF0F2;--papel:#FFFFFF;--tinta:#17262E;--pizarra:#174250;--gris:#898E91;--gris-suave:#C9D1D5;--linea:#D5DDE1;
  --propuesta:#3E87AA;--ahorro:#2F7D32;--ahorro-fondo:#E4F1E3;--sobre:#8E2450;--sobre-fondo:#F6E4EC;--ambar:#8A5A00;--ambar-fondo:#FBF0D5;
  --radio-g:18px;--radio-m:10px;--radio-p:6px;
  --f-texto:'Onest',system-ui,sans-serif;--f-marca:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 15px/1.5 var(--f-texto);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pizarra);outline-offset:2px;border-radius:var(--radio-p)}
a{color:var(--pizarra)}
h1,h2,h3{margin:0}
h1{font:700 32px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}
h2{font:700 22px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}
.top{background:var(--papel);border-bottom:1px solid var(--linea)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:32px}
.logo{height:42px;display:block}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:var(--radio-m);text-decoration:none;font-weight:500;color:#41545D}
.nav a[aria-current=page]{background:var(--fondo);color:var(--pizarra)}
.top .user{margin-left:auto;font-size:14px;color:#52646C}
.demo{background:var(--ambar-fondo);color:var(--ambar);font-size:13px;text-align:center;padding:6px 12px}
main{max-width:1180px;margin:0 auto;padding:28px 24px 96px;display:grid;gap:20px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cab p{margin:6px 0 0;color:#41545D}
.migas{font-size:14px;margin:0}
.btn{min-height:44px;padding:0 20px;border-radius:var(--radio-m);border:0;background:var(--pizarra);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#0F3340}
.btn:disabled{background:var(--gris-suave);color:#5B6B72;cursor:not-allowed}
.btn.sec{background:var(--papel);color:var(--pizarra);border:2px solid var(--pizarra)}
.btn.sec:hover:not(:disabled){background:var(--fondo)}
.btn.sec:disabled{background:var(--papel);border-color:var(--gris-suave);color:#8A979D}
.txt-btn{background:none;border:0;padding:6px 4px;color:var(--pizarra);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.card{background:var(--papel);border-radius:var(--radio-g);padding:24px}
/* lista */
.tabla{width:100%;border-collapse:collapse;background:var(--papel);border-radius:var(--radio-g);overflow:hidden}
.tabla th{text-align:left;font-size:13px;font-weight:500;color:#52646C;padding:14px 16px;border-bottom:2px solid var(--pizarra)}
.tabla td{padding:14px 16px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tbody tr{cursor:pointer}.tabla tbody tr:hover{background:#F4F8F9}.tabla tbody tr:last-child td{border-bottom:0}
.tabla .der{text-align:right}
.sub{display:block;font-size:13px;color:#52646C}
.t-link{font-weight:600;color:var(--tinta);text-decoration:none}.t-link:hover{text-decoration:underline}
.estado{display:inline-flex;align-items:center;gap:8px}
.punto{width:10px;height:10px;border-radius:50%;background:var(--ahorro)}.punto.off{background:var(--gris)}
/* edición */
.cols{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:20px;align-items:start}
.pila{display:grid;gap:20px}
.sticky{position:sticky;top:16px}
fieldset{border:0;margin:0;padding:0;display:grid;gap:16px;min-width:0}
legend{font:700 22px/1.1 var(--f-marca);color:var(--pizarra);padding:0;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.campo{display:grid;gap:4px;align-content:start}
.campo label{font-size:14px;color:var(--tinta);font-weight:500}
.campo .ayuda{font-size:13px;color:#52646C}
.campo input[type=text]{min-height:46px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB;font-size:16px}
.campo input[type=text]:hover{border-color:var(--gris)}
.campo.err input{border-color:var(--sobre);background:var(--sobre-fondo)}
.campo .msg{font-size:13px;color:var(--sobre);font-weight:500;min-height:0}
.unidad{position:relative}
.unidad input{width:100%;padding-right:48px!important;text-align:right}
.unidad span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:#52646C;pointer-events:none}
.unidad.pre span{left:12px;right:auto}.unidad.pre input{padding-left:30px;padding-right:12px!important}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--pizarra);border-radius:var(--radio-m);overflow:hidden}
.seg button{background:var(--papel);border:0;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:2px}
.seg button+button{border-left:2px solid var(--pizarra)}
.seg button[aria-pressed=true]{background:var(--pizarra);color:#fff}
.seg b{font-weight:600}.seg small{font-size:13px;opacity:.85}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer}
.sw input{width:22px;height:22px;accent-color:var(--pizarra)}
.nota{background:var(--fondo);border-radius:var(--radio-m);padding:12px 14px;font-size:14px;color:#41545D}
/* simulación */
.sim .campo{margin-top:12px}
.sim select{min-height:44px;padding:8px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB}
.res{display:grid;gap:0;margin-top:16px}
.res>div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-top:1px solid var(--linea)}
.res dt{color:#41545D;font-size:14.5px}.res dd{margin:0;font-weight:500;font-size:19px;text-align:right}
.res .nuevo dt{color:var(--tinta);font-weight:600}.res .nuevo dd{font-size:26px;font-weight:300;letter-spacing:-.01em}
.ahorro{color:var(--ahorro)}.sobre{color:var(--sobre)}
.aviso{border-radius:var(--radio-m);padding:10px 14px;font-size:14px;margin-top:10px}
.aviso.cred{background:var(--ambar-fondo);color:var(--ambar)}.aviso.err{background:var(--sobre-fondo);color:#5A1735}
/* barra de guardado */
.guardar{position:fixed;inset:auto 0 0 0;background:var(--papel);border-top:1px solid var(--linea);padding:12px 24px;z-index:5}
.guardar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:16px}
.guardar .est{flex:1;font-size:14.5px}
.guardar .est.sucio{font-weight:600;color:var(--ambar)}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:var(--radio-m);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.cols{grid-template-columns:1fr}.sticky{position:static}.grid2{grid-template-columns:1fr}.top .in{gap:16px;padding:10px 16px}main{padding:20px 16px 96px}.guardar{padding:12px 16px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="cab"></div></header>
<main id="app"><p class="sub">Cargando…</p></main>
<div class="toast" id="toast" role="status"></div>

<script src="/app/motor.js"></script>
<script src="/app/api.js"></script>
<script>
/* ═══════════ DATOS ═══════════ */
// Proyectos: los mismos campos que ProyectoConfig (backend/proyectos/models.py), desde la API
let PROYECTOS=[];
const cuotas=(n,desde,dia,valor,concepto='Recursos Propios',extra=()=>({}))=>Array.from({length:n},(_,i)=>({fecha_pp:addM(desde+i,dia),concepto,valor,...extra(i)}));
const pagos=(n,desde,dia,valor,concepto='Recursos Propios')=>Array.from({length:n},(_,i)=>({fecha:addM(desde+i,dia),concepto,valor}));
// Respaldo para la simulación si IngeMAX no responde
const EJEMPLOS=[
  {id_venta:2502,inmueble:'T2 - AP-504 (al día, con crédito)',valor_venta:412000000,valor_credito:294000000,fecha_escrituracion_programada:addM(13,20),
    plan_pagos:[{fecha_pp:addM(-12,5),concepto:'Separacion',valor:10000000},...cuotas(24,-11,5,4500000,'Cuota inicial')],
    recaudo:[{fecha:addM(-12,5),concepto:'Separacion',valor:10000000},...pagos(8,-11,6,4500000)]},
  {id_venta:1974,inmueble:'T1 - 602 (con cuotas vencidas)',valor_venta:487500000,valor_credito:341250000,fecha_escrituracion_programada:'1900-01-01',
    plan_pagos:cuotas(15,-9,28,9750000,'Recursos Propios',i=>({int_mora:i<9?180000:0,int_aplicado:i<5?1:(i===5?0:(i===6?60000:0))})),
    recaudo:[...pagos(5,-9,28,10000000),{fecha:addM(-4,28),concepto:'Recursos Propios',valor:10400000}]},
  {id_venta:2610,inmueble:'T1 - AP-301 (al día)',valor_venta:355000000,valor_credito:248500000,fecha_escrituracion_programada:addM(10,25),
    plan_pagos:cuotas(12,-3,10,5900000,'Cuota inicial'),recaudo:pagos(3,-3,10,5900000)}
];
const ESCENARIOS=[['adelanto','Adelantar las últimas 3 cuotas'],['aplaza','Aplazar la última cuota 2 meses'],['igual','Dejar el plan como está']];
function variante(prop,tipo){
  const p=prop.map(x=>({...x}));
  if(tipo==='adelanto'&&p.length>3){const ult=p.splice(-3);p[1].valor+=ult.reduce((s,x)=>s+x.valor,0);p[1].fijo=true}
  if(tipo==='aplaza'&&p.length>2){const u=p[p.length-1];const d=new Date(u.fecha+'T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+2);u.fecha=iso(d)}
  return p;
}

/* ═══════════ CONVERSIÓN CONFIG ⇄ FORMULARIO ═══════════ */
const pctTxt=v=>(Math.round(v*100000)/1000).toLocaleString('es-CO',{maximumFractionDigits:3});
const pctNum=s=>{const t=String(s).trim().replace(/\s/g,'').replace('%','').replace(',','.');return t===''||isNaN(Number(t))?NaN:Number(t)/100};
const toDraft=p=>({metodo:p.metodo,tasa_cia:pctTxt(p.tasa_cia),tasa_cliente:pctTxt(p.tasa_cliente),tasa_vpn:pctTxt(p.tasa_vpn),tope_pct:pctTxt(p.tope_pct),umbral_pct:pctTxt(p.umbral_pct),cuota_min:num(p.cuota_min),concepto:p.concepto,concepto_abono:p.concepto_abono,activo:p.activo});
function leer(d){
  const e={},v={metodo:d.metodo,activo:d.activo,concepto:d.concepto.trim(),concepto_abono:d.concepto_abono.trim()};
  for(const k of['tasa_cia','tasa_cliente','tasa_vpn','tope_pct','umbral_pct']){
    const x=pctNum(d[k]);v[k]=x;
    if(isNaN(x))e[k]='Escribe un porcentaje, por ejemplo 1,5';
    else if(x<0)e[k]='No puede ser negativo';
    else if(x>(k==='tope_pct'||k==='umbral_pct'?0.2:0.1))e[k]=k.startsWith('tasa')?'Parece muy alta: máximo 10 % mensual':'Máximo 20 % del valor de venta';
  }
  v.cuota_min=parseNum(d.cuota_min);if(d.cuota_min.trim()===''||v.cuota_min<0)e.cuota_min='Escribe un valor en pesos';
  if(!e.tope_pct&&!e.umbral_pct&&v.umbral_pct>v.tope_pct)e.umbral_pct='El umbral no puede superar el tope de descuento';
  if(!v.concepto)e.concepto='El concepto no puede quedar vacío';
  if(!v.concepto_abono)e.concepto_abono='El concepto no puede quedar vacío';
  return{v,e,ok:Object.keys(e).length===0};
}
const aCfg=v=>({metodo:v.metodo,tasaCia:v.tasa_cia,tasaCliente:v.tasa_cliente,tasaVpn:v.tasa_vpn,topePct:v.tope_pct,umbralPct:v.umbral_pct,cuotaMin:v.cuota_min,conceptoAbono:v.concepto_abono});
const claves=['metodo','tasa_cia','tasa_cliente','tasa_vpn','tope_pct','umbral_pct','cuota_min','concepto','concepto_abono','activo'];
const sucio=(d,p)=>{const o=toDraft(p);return claves.some(k=>String(d[k])!==String(o[k]))};

/* ═══════════ ESTADO ═══════════ */
const UI={id:null,draft:null,drafts:{},neg:null,esc:'adelanto',negs:EJEMPLOS,negsDe:{},guardando:false};
const proy=id=>PROYECTOS.find(p=>p.id===id);

/* ═══════════ LISTA ═══════════ */
function tasasTxt(p){return p.metodo==='vpn'?`${pctTxt(p.tasa_vpn)} % mensual compuesta`:`Adelantos ${pctTxt(p.tasa_cia)} % · Atrasos ${pctTxt(p.tasa_cliente)} %`}
function vistaLista(){
  $('#app').innerHTML=`
  <div class="cab"><div><h1>Proyectos y tasas</h1><p>Aquí defines cómo se calcula el descuento o el cargo de cada proyecto. IngeMAX no entrega estas tasas, por eso se administran en Replantea.</p></div></div>
  <table class="tabla"><thead><tr><th scope="col">Proyecto</th><th scope="col">Método</th><th scope="col">Tasas</th><th scope="col" class="der">Tope de descuento</th><th scope="col" class="der">Aprueba gerencia desde</th><th scope="col">Estado</th></tr></thead>
  <tbody>${PROYECTOS.map(p=>`<tr data-id="${p.id}" tabindex="0">
    <td><a class="t-link" href="#/p/${p.id}">${esc(p.nombre)}</a><span class="sub">IngeMAX #${p.id_imx}</span></td>
    <td>${p.metodo==='vpn'?'VPN':'Liquidación de saldo'}</td><td>${tasasTxt(p)}${p.metodo==='vpn'?'':'<span class="sub">mensual</span>'}</td>
    <td class="der">${pctTxt(p.tope_pct)} %</td><td class="der">${pctTxt(p.umbral_pct)} %</td>
    <td><span class="estado"><span class="punto ${p.activo?'':'off'}"></span>${p.activo?'Activo':'Inactivo'}</span>${UI.drafts[p.id]&&sucio(UI.drafts[p.id],p)?'<span class="sub">Cambios sin guardar</span>':''}</td></tr>`).join('')}</tbody></table>`;
}

/* ═══════════ EDICIÓN ═══════════ */
function campoPct(k,label,ayuda,d,errs){return`<div class="campo ${errs[k]?'err':''}"><label for="c-${k}">${label}</label>
  <div class="unidad"><input type="text" id="c-${k}" data-k="${k}" inputmode="decimal" value="${esc(d[k])}" ${errs[k]?`aria-invalid="true" aria-describedby="m-${k}"`:''}><span>%</span></div>
  <span class="ayuda">${ayuda}</span><span class="msg" id="m-${k}">${errs[k]||''}</span></div>`}
function vistaEditar(id){
  const p=proy(id);if(!p){$('#app').innerHTML='<div class="card"><p>No encontramos ese proyecto.</p><a href="#/">Volver a proyectos</a></div>';return}
  UI.id=id;UI.draft=(UI.drafts[id]??=toDraft(p));
  const d=UI.draft,{e}=leer(d),liq=d.metodo==='liquidacion';
  $('#app').innerHTML=`
  <p class="migas"><a href="#/">← Proyectos</a></p>
  <div class="cab"><div><h1>${esc(p.nombre)}</h1><p>IngeMAX #${p.id_imx}</p></div></div>
  <div class="cols"><form class="pila" id="form" novalidate onsubmit="return false">
    <section class="card"><fieldset><legend>Método de cálculo</legend>
      <div class="seg" role="group" aria-label="Método de cálculo">
        <button type="button" data-metodo="liquidacion" aria-pressed="${liq}"><b>Liquidación de saldo</b><small>Interés simple sobre el saldo, como el Excel de VyP</small></button>
        <button type="button" data-metodo="vpn" aria-pressed="${!liq}"><b>Valor presente neto</b><small>Una tasa mensual compuesta</small></button></div>
      <div id="bloque-tasas" class="grid2">${liq?campoPct('tasa_cia','Tasa por adelantar pagos','Mensual, interés simple. Genera el descuento.',d,e)+campoPct('tasa_cliente','Tasa por aplazar pagos','Mensual, interés simple. Genera el cargo.',d,e):campoPct('tasa_vpn','Tasa mensual','Compuesta. La diferencia se expresa a la fecha del último pago.',d,e)}</div>
    </fieldset></section>
    <section class="card"><fieldset><legend>Límites</legend><div class="grid2">
      ${campoPct('tope_pct','Tope de descuento','Porcentaje máximo del valor de venta.',d,e)}
      ${campoPct('umbral_pct','Aprueba gerencia desde','Un descuento mayor a este porcentaje requiere aprobación.',d,e)}
      <div class="campo ${e.cuota_min?'err':''}"><label for="c-cuota_min">Cuota mínima</label><div class="unidad pre"><span>$</span><input type="text" id="c-cuota_min" data-k="cuota_min" inputmode="numeric" value="${esc(d.cuota_min)}"></div><span class="ayuda">Ninguna cuota de la propuesta puede ser menor, salvo los abonos.</span><span class="msg" id="m-cuota_min">${e.cuota_min||''}</span></div></div>
      <p class="nota">Los días de gracia de la mora los configura IngeMAX por proyecto; no se editan aquí.</p>
    </fieldset></section>
    <section class="card"><fieldset><legend>Conceptos al cargar en IngeMAX</legend><div class="grid2">
      <div class="campo ${e.concepto?'err':''}"><label for="c-concepto">Concepto de la línea de ajuste</label><input type="text" id="c-concepto" data-k="concepto" value="${esc(d.concepto)}"><span class="ayuda">Debe coincidir exactamente con IngeMAX.</span><span class="msg" id="m-concepto">${e.concepto||''}</span></div>
      <div class="campo ${e.concepto_abono?'err':''}"><label for="c-concepto_abono">Concepto de los abonos</label><input type="text" id="c-concepto_abono" data-k="concepto_abono" value="${esc(d.concepto_abono)}"><span class="ayuda">Se usa para los abonos extraordinarios.</span><span class="msg" id="m-concepto_abono">${e.concepto_abono||''}</span></div></div>
    </fieldset></section>
    <section class="card"><fieldset><legend>Disponibilidad</legend>
      <label class="sw"><input type="checkbox" id="c-activo" ${d.activo?'checked':''}><span>Proyecto activo: los asesores pueden crear solicitudes</span></label></fieldset></section>
  </form>
  <aside class="card sim sticky" aria-label="Simulación de prueba"><h2>Prueba el cambio</h2><p class="sub" style="margin-top:6px">Mira cuánto cambia el resultado antes de guardar.</p>
    <div class="campo"><label for="s-neg">Negocio de ejemplo</label><select id="s-neg">${UI.negs.map(n=>`<option value="${n.id_venta}" ${n.id_venta===UI.neg?'selected':''}>${esc(n.inmueble)}</option>`).join('')}</select></div>
    <div class="campo"><label for="s-esc">Propuesta del comprador</label><select id="s-esc">${ESCENARIOS.map(([k,t])=>`<option value="${k}" ${k===UI.esc?'selected':''}>${t}</option>`).join('')}</select></div>
    <div id="sim-res"></div></aside></div>
  <div class="guardar"><div class="in"><span class="est" id="estado" role="status"></span>
    <button class="btn sec" id="btn-desc" type="button">Descartar cambios</button><button class="btn" id="btn-guardar" type="button">Guardar cambios</button></div></div>`;
  actualizar();
}

function simular(cfg){
  const n=UI.negs.find(x=>x.id_venta===UI.neg),a=analizar(n),prop=variante(initPropuesta(a),UI.esc);
  return calc({propuesta:prop},a,n,cfg);
}
const res=aj=>aj<=-1?`<span class="ahorro">Ahorra ${fmt(-aj)}</span>`:aj>=1?`<span class="sobre">Paga ${fmt(aj)} de más</span>`:'Sin cambio';
// actualiza simulación, estado y botones sin reconstruir el formulario (conserva el foco)
function actualizar(){
  const p=proy(UI.id),{v,ok,e}=leer(UI.draft),cambio=sucio(UI.draft,p);
  const base=simular(aCfg(p)),n=UI.negs.find(x=>x.id_venta===UI.neg);
  let html;
  if(!ok)html='<div class="aviso err" role="alert">Corrige los campos marcados para ver la simulación.</div>';
  else{const nu=simular(aCfg(v)),dif=nu.ev.ajuste-base.ev.ajuste;
    html=`<dl class="res"><div><dt>Con la configuración guardada</dt><dd>${res(base.ev.ajuste)}</dd></div>
      <div class="nuevo"><dt>Con tus cambios</dt><dd>${res(nu.ev.ajuste)}</dd></div>
      <div><dt>Diferencia para el comprador</dt><dd>${!cambio||Math.abs(dif)<1?'Ninguna':(dif<0?`<span class="ahorro">${fmt(-dif)} más a favor</span>`:`<span class="sobre">${fmt(dif)} menos a favor</span>`)}</dd></div></dl>
      ${nu.ev.topado?`<div class="aviso cred">El descuento llega al tope: se limita a ${fmt(nu.ev.tope)}.</div>`:''}
      ${nu.ev.requiereAprobacion?`<div class="aviso cred">Con estos valores, esta propuesta necesita aprobación de gerencia (supera ${fmt(Math.round(n.valor_venta*v.umbral_pct))}).</div>`:''}`}
  $('#sim-res').innerHTML=html;
  const est=$('#estado');est.textContent=!cambio?'Sin cambios':(ok?'Tienes cambios sin guardar':'Hay campos por corregir');est.className='est'+(cambio?' sucio':'');
  $('#btn-guardar').disabled=!(cambio&&ok);$('#btn-desc').disabled=!cambio;
  // errores por campo (sin tocar los inputs)
  for(const k of['tasa_cia','tasa_cliente','tasa_vpn','tope_pct','umbral_pct','cuota_min','concepto','concepto_abono']){
    const m=document.getElementById('m-'+k),inp=document.getElementById('c-'+k);if(!m||!inp)continue;
    m.textContent=e[k]||'';m.closest('.campo').classList.toggle('err',!!e[k]);
    if(e[k]){inp.setAttribute('aria-invalid','true');inp.setAttribute('aria-describedby','m-'+k)}else{inp.removeAttribute('aria-invalid');inp.removeAttribute('aria-describedby')}}
}

/* ═══════════ EVENTOS ═══════════ */
document.addEventListener('input',e=>{
  const k=e.target.dataset&&e.target.dataset.k;if(!k||!UI.draft)return;
  UI.draft[k]=e.target.value;actualizar();
});
document.addEventListener('change',e=>{
  if(e.target.id==='c-activo'){UI.draft.activo=e.target.checked;actualizar()}
  if(e.target.id==='s-neg'){UI.neg=Number(e.target.value);actualizar()}
  if(e.target.id==='s-esc'){UI.esc=e.target.value;actualizar()}
  // al salir del campo, normaliza el formato
  const k=e.target.dataset&&e.target.dataset.k;
  if(k==='cuota_min'){const n=parseNum(e.target.value);if(e.target.value.trim()!==''){UI.draft.cuota_min=num(n);e.target.value=UI.draft.cuota_min}}
  if(['tasa_cia','tasa_cliente','tasa_vpn','tope_pct','umbral_pct'].includes(k)){const x=pctNum(e.target.value);if(!isNaN(x)){UI.draft[k]=pctTxt(x);e.target.value=UI.draft[k]}}
});
document.addEventListener('click',e=>{
  const row=e.target.closest('tbody tr[data-id]');if(row&&!e.target.closest('a')){location.hash='#/p/'+row.dataset.id;return}
  const m=e.target.closest('[data-metodo]');if(m){UI.draft.metodo=m.dataset.metodo;vistaEditar(UI.id);return}
  if(e.target.id==='btn-desc'){delete UI.drafts[UI.id];vistaEditar(UI.id);toast('Cambios descartados.')}
  if(e.target.id==='btn-guardar')guardar();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('tbody tr[data-id]'))location.hash='#/p/'+e.target.dataset.id});
window.addEventListener('beforeunload',e=>{if(Object.entries(UI.drafts).some(([id,d])=>sucio(d,proy(Number(id))))){e.preventDefault();e.returnValue=''}});

/* ═══════════ NEGOCIOS DE EJEMPLO Y GUARDADO ═══════════ */
// Negocios reales del proyecto (IngeMAX) para probar el cambio; si no hay, los de respaldo
async function cargarNegocios(p){
  if(UI.negsDe[p.id]){UI.negs=UI.negsDe[p.id];if(!UI.negs.find(n=>n.id_venta===UI.neg))UI.neg=UI.negs[0].id_venta;return}
  let lista=EJEMPLOS;
  try{
    const r=await API.get('/negocios?proyecto_id='+p.id_imx);
    const buenos=r.filter(n=>Array.isArray(n.plan_pagos)&&n.plan_pagos.length&&n.valor_venta).slice(0,25)
      .map(n=>({...n,id_venta:n.id_venta||n.id,recaudo:n.recaudo||[],valor_credito:n.valor_credito||0,inmueble:(n.inmueble||'Venta '+(n.id_venta||n.id))}));
    if(buenos.length)lista=buenos;
  }catch(e){if(e.status===401)throw e}
  UI.negsDe[p.id]=lista;UI.negs=lista;
  if(!lista.find(n=>n.id_venta===UI.neg))UI.neg=lista[0].id_venta;
}
async function guardar(){
  if(UI.guardando)return;
  const {v,ok}=leer(UI.draft);if(!ok)return;
  const p=proy(UI.id);UI.guardando=true;$('#btn-guardar').disabled=true;
  try{
    // solo viajan los campos que cambiaron
    const cambios={};for(const k of claves){if(String(toDraft({...p,...v})[k])!==String(toDraft(p)[k]))cambios[k]=v[k]}
    await API.patch('/proyectos/'+p.id,cambios);
    Object.assign(p,v);delete UI.drafts[UI.id];vistaEditar(UI.id);toast('Cambios guardados.');
  }catch(e){
    if(e.status===401)return location.replace('/app/login.html?next='+encodeURIComponent(location.pathname+location.hash));
    toast(e.message);actualizar();
  }finally{UI.guardando=false}
}

/* ═══════════ RUTAS ═══════════ */
async function render(){
  const h=location.hash||'#/';
  try{
    PROYECTOS=await API.get('/proyectos?todos=true');
    if(h.startsWith('#/p/')){
      const p=proy(Number(h.slice(4)));
      if(p)await cargarNegocios(p);
      vistaEditar(Number(h.slice(4)));
    }else{UI.id=null;UI.draft=null;vistaLista()}
  }catch(e){
    if(e.status===401)return location.replace('/app/login.html?next='+encodeURIComponent(location.pathname+location.hash));
    $('#app').innerHTML='<div class="card"><p>'+esc(e.message)+'</p><button class="txt-btn" onclick="render()">Reintentar</button></div>';
  }
}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});
(async()=>{
  const u=await exigirSesion(['gerente']);
  if(!u)return;
  pintarCabecera(u,'/app/proyectos.html');
  render();
})();
</script>
