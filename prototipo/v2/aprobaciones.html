<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aprobaciones · Viviendas y Proyectos</title>
<link rel="icon" type="image/svg+xml" href="/app/img/icono-vyp.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#EBF0F2;--papel:#FFFFFF;--tinta:#17262E;--pizarra:#174250;--gris:#898E91;--gris-suave:#C9D1D5;--linea:#D5DDE1;
  --pagado:#A7B4BA;--propuesta:#3E87AA;--credito:#6F8794;
  --ahorro:#2F7D32;--ahorro-fondo:#E4F1E3;--sobre:#8E2450;--sobre-fondo:#F6E4EC;--ambar:#8A5A00;--ambar-fondo:#FBF0D5;
  --radio-g:18px;--radio-m:10px;--radio-p:6px;
  --f-texto:'Onest',system-ui,sans-serif;--f-marca:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 15px/1.5 var(--f-texto);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pizarra);outline-offset:2px;border-radius:var(--radio-p)}
a{color:var(--pizarra)}
h1,h2,h3{margin:0}
h1{font:700 32px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}
h2{font:700 22px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}
.top{background:var(--papel);border-bottom:1px solid var(--linea)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:32px}
.logo{height:42px;display:block}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:var(--radio-m);text-decoration:none;font-weight:500;color:#41545D}
.nav a[aria-current=page]{background:var(--fondo);color:var(--pizarra)}
.top .user{margin-left:auto;font-size:14px;color:#52646C}
.demo{background:var(--ambar-fondo);color:var(--ambar);font-size:13px;text-align:center;padding:6px 12px}
main{max-width:1180px;margin:0 auto;padding:28px 24px 64px;display:grid;gap:20px}
.cab p{margin:6px 0 0;color:#41545D}
.btn{min-height:46px;padding:0 22px;border-radius:var(--radio-m);border:0;background:var(--pizarra);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#0F3340}
.btn:disabled{background:var(--gris-suave);color:#5B6B72;cursor:not-allowed}
.btn.sec{background:var(--papel);color:var(--pizarra);border:2px solid var(--pizarra)}
.btn.sec:hover:not(:disabled){background:var(--fondo)}
.txt-btn{background:none;border:0;padding:6px 4px;color:var(--pizarra);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.card{background:var(--papel);border-radius:var(--radio-g);padding:22px}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--linea)}
.tabs button{background:none;border:0;padding:10px 14px;margin-bottom:-2px;border-bottom:3px solid transparent;color:#41545D;font-weight:500;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--pizarra);border-bottom-color:var(--pizarra);font-weight:600}
.tabs .n{color:#52646C;font-weight:400;margin-left:4px}
.maestro{display:grid;grid-template-columns:340px minmax(0,1fr);gap:20px;align-items:start}
.lista{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.lista button{width:100%;text-align:left;background:var(--papel);border:1.5px solid transparent;border-radius:var(--radio-m);padding:14px 16px;cursor:pointer;display:grid;gap:2px}
.lista button:hover{border-color:var(--gris-suave)}
.lista button[aria-current=true]{border-color:var(--pizarra);box-shadow:inset 0 0 0 1px var(--pizarra)}
.lista b{font-weight:600}
.lista .fila{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sub{display:block;font-size:13px;color:#52646C}
.ahorro{color:var(--ahorro);font-weight:600}.sobre{color:var(--sobre);font-weight:600}
.pila{display:grid;gap:20px}
.cab-d{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--fondo);font-weight:500;font-size:14px}
.punto{width:10px;height:10px;border-radius:50%;background:#C58A12}.punto.ap{background:var(--ahorro)}.punto.dev{background:var(--sobre)}
.motivo{border-radius:var(--radio-m);background:var(--ambar-fondo);color:#5E3C00;padding:14px 16px}
.motivo b{font-weight:600}
.motivo .cifras{display:flex;gap:28px;flex-wrap:wrap;margin-top:8px}
.motivo .cifras div{display:grid}
.motivo .cifras span{font-size:13px}
.motivo .cifras strong{font-size:20px;font-weight:600}
.fila-res{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.fila-res .cifra{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.linea svg{width:100%;height:auto;max-height:230px;display:block;overflow:visible}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#41545D}
.leyenda li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.pag{background:var(--pagado)}.sw.act{border:2px dashed var(--tinta)}.sw.pro{background:var(--propuesta)}.sw.cre{background:var(--credito)}
.tabla{width:100%;border-collapse:collapse;font-size:14.5px}
.tabla th{text-align:left;font-size:13px;font-weight:500;color:#52646C;padding:0 0 8px;border-bottom:2px solid var(--pizarra)}
.tabla td{padding:8px 0;border-bottom:1px solid var(--linea)}
.tabla .der,.tabla th.der{text-align:right}
.tabla .lado{border-left:1px solid var(--linea);padding-left:14px}
.tabla thead tr:first-child th{font:700 18px/1.2 var(--f-marca);color:var(--pizarra);border-bottom:0;padding-bottom:6px}
.tabla .venc{color:var(--sobre);font-weight:500}
.tabla tfoot td{font-weight:600;border-bottom:0}
.aviso{border-radius:var(--radio-m);padding:12px 14px;font-size:14px;margin-top:12px}
.aviso p{margin:0}
.aviso.mora{background:var(--sobre-fondo);color:#5A1735}.aviso.cred{background:var(--ambar-fondo);color:var(--ambar)}
.aviso.ok{background:var(--ahorro-fondo);color:#1D5A20}.aviso.dev{background:var(--sobre-fondo);color:#5A1735}
.datos{margin:8px 0 0;display:grid}
.datos div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--linea)}
.datos div:first-child{border-top:0}
.datos dt{color:#52646C;font-size:14px}.datos dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.decision{position:sticky;bottom:0;background:var(--papel);border-radius:var(--radio-g);padding:18px 22px;box-shadow:0 -2px 0 var(--linea)}
.decision .btns{display:flex;gap:12px;flex-wrap:wrap}
.decision label{display:block;font-weight:500;margin-bottom:4px}
.decision textarea{width:100%;min-height:92px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB;resize:vertical}
.decision .ayuda{font-size:13px;color:#52646C;margin:4px 0 12px}
.vacio{padding:40px 16px;text-align:center;color:#52646C}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:var(--radio-m);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
@media(max-width:1000px){.maestro{grid-template-columns:1fr}.top .in{gap:16px;padding:10px 16px}main{padding:20px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="cab"></div></header>
<main id="app"><p class="vacio">Cargando…</p></main>
<div class="toast" id="toast" role="status"></div>

<script src="/app/motor.js"></script>
<script src="/app/api.js"></script>
<script>
/* ═══════════ ESTADO ═══════════ */
const UI = { tab: 'pendiente', sel: null, devolviendo: false, texto: '', lista: [], det: null, ocupado: false };

const dia = iso => (iso || '').slice(0, 10);
const pctTxt = v => (v * 100).toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' %';
const hace = iso => { const d = Math.round((Date.parse(CORTE + 'T12:00:00Z') - Date.parse(dia(iso) + 'T12:00:00Z')) / 86400000); return d <= 0 ? 'hoy' : d === 1 ? 'ayer' : `hace ${d} días`; };
const adaptar = an => ({ recaudo: an.recaudo, pend: an.pendiente, credito: an.credito, fechaCredito: an.fecha_credito });
const RESUELTAS = new Set(['devuelta', 'por_cargar', 'cargada', 'verificada']);

function mostrarError(e) {
  if (e.status === 401) { location.replace('/app/login.html?next=' + encodeURIComponent(location.pathname)); return; }
  $('#app').innerHTML = `<div class="card vacio"><p>${esc(e.message)}</p><button class="txt-btn" onclick="cargar()">Reintentar</button></div>`;
}

/* ═══════════ LISTA ═══════════ */
const pendientes = () => UI.lista.filter(s => s.estado_ui === 'por_aprobar').sort((a, b) => (a.firmada_en || '').localeCompare(b.firmada_en || ''));
// Resueltas: las que necesitaban aprobación y ya tienen una decisión (aprobada o devuelta)
const resueltas = () => UI.lista.filter(s => s.requiere_aprobacion && s.firmada_en && RESUELTAS.has(s.estado_ui)).sort((a, b) => (b.firmada_en || '').localeCompare(a.firmada_en || ''));
const visibles = () => UI.tab === 'pendiente' ? pendientes() : resueltas();

async function cargar() {
  UI.lista = await API.get('/solicitudes');
  const L = visibles();
  if (!L.find(s => s.id === UI.sel)) UI.sel = L[0] ? L[0].id : null;
  render();
  if (UI.sel) await detalle(UI.sel);
}

function render() {
  const pend = pendientes().length, res = resueltas().length, L = visibles();
  const frase = pend ? `${pend} propuesta${pend === 1 ? '' : 's'} esperando tu decisión.` : 'No tienes propuestas pendientes.';
  $('#app').innerHTML = `
  <div class="cab"><h1>Aprobaciones</h1><p>${frase}</p></div>
  <div class="tabs" role="tablist" aria-label="Estado"><button role="tab" aria-selected="${UI.tab === 'pendiente'}" data-tab="pendiente" type="button">Pendientes<span class="n">${pend}</span></button><button role="tab" aria-selected="${UI.tab === 'resuelta'}" data-tab="resuelta" type="button">Resueltas<span class="n">${res}</span></button></div>
  ${L.length ? `<div class="maestro"><ul class="lista" aria-label="Propuestas">${L.map(s => `<li><button type="button" data-sel="${s.id}" aria-current="${s.id === UI.sel}"><span class="fila"><b>${esc(s.inmueble || 'Venta ' + s.id_venta)}</b><span class="${s.ajuste < 0 ? 'ahorro' : 'sobre'}">${fmt(Math.abs(s.ajuste))}</span></span><span class="sub">${esc(s.comprador.nombre)} · ${esc(s.proyecto.nombre)}</span><span class="sub">Firmada ${hace(s.firmada_en)}</span></button></li>`).join('')}</ul>
    <div id="detalle"></div></div>`
  : `<div class="card vacio"><p>${UI.tab === 'pendiente' ? 'No hay propuestas por aprobar.' : 'Todavía no has resuelto ninguna propuesta.'}</p></div>`}`;
}

/* ═══════════ DETALLE ═══════════ */
async function detalle(id) {
  const d = await API.get('/solicitudes/' + id);
  if (UI.sel !== id || !document.getElementById('detalle')) return;
  UI.det = d;
  const a = adaptar(d.analisis), r = d.resultado, aj = d.ajuste;
  const izq = [...d.analisis.pendiente].sort((x, y) => x.fecha.localeCompare(y.fecha)), der = [...d.propuesta].sort((x, y) => x.fecha.localeCompare(y.fecha)), v = izq.filter(p => p.vencida).length;
  let filas = '';
  for (let i = 0; i < Math.max(izq.length, v + der.length); i++) {
    const l = izq[i], p = i >= v ? der[i - v] : null;
    filas += `<tr><td class="${l && l.vencida ? 'venc' : ''}">${l ? dmy(l.fecha) : ''}</td><td class="der ${l && l.vencida ? 'venc' : ''}">${l ? num(l.valor) : ''}</td><td class="lado">${p ? dmy(p.fecha) : ''}</td><td class="der">${p ? num(p.valor) : ''}</td></tr>`;
  }
  if (d.analisis.credito > 0) filas += `<tr><td>Crédito</td><td class="der">${num(d.analisis.credito)}</td><td class="lado">Crédito</td><td class="der">${num(d.nuevo_credito)}</td></tr>`;

  const pendiente = d.estado_ui === 'por_aprobar';
  const decision = pendiente ? `<div class="decision">${UI.devolviendo ? `
      <label for="com">¿Qué debe corregir el asesor?</label>
      <div class="ayuda" id="com-ayuda">El comentario le llega al asesor junto con la propuesta.</div>
      <textarea id="com" aria-describedby="com-ayuda">${esc(UI.texto)}</textarea>
      <div class="btns" style="margin-top:12px"><button class="btn" data-act="devolver" type="button" ${UI.texto.trim().length < 10 ? 'disabled' : ''}>Devolver al asesor</button><button class="btn sec" data-act="cancelar" type="button">Cancelar</button></div>`
    : `<div class="btns"><button class="btn" data-act="aprobar" type="button">Aprobar propuesta</button><button class="btn sec" data-act="pedir-dev" type="button">Devolver con comentario</button></div>`}</div>` : '';
  const dec = d.decision;
  const estado = dec ? (d.estado_ui === 'devuelta'
    ? `<div class="aviso dev"><p><b>Devuelta ${hace(dec.fecha)} por ${esc(dec.por)}.</b> ${esc(dec.comentario)}</p></div>`
    : `<div class="aviso ok"><p><b>Aprobada ${hace(dec.fecha)} por ${esc(dec.por)}.</b> El asesor ya puede cargar el plan en IngeMAX.</p></div>`) : '';
  const etiqueta = pendiente ? 'Pendiente' : d.estado_ui === 'devuelta' ? 'Devuelta' : 'Aprobada';
  const clase = pendiente ? '' : d.estado_ui === 'devuelta' ? 'dev' : 'ap';
  const umbralPct = d.valor_venta ? d.umbral / d.valor_venta : 0;
  $('#detalle').innerHTML = `<div class="pila">
    <section class="card"><div class="cab-d"><div><h2 style="font-size:28px">${esc(d.inmueble || 'Venta ' + d.id_venta)} · ${esc(d.comprador.nombre)}</h2><span class="sub">${esc(d.proyecto.nombre)} · Venta ${fmtM(d.valor_venta)} · Negocio ${d.id_venta}</span></div>
      <span class="chip"><span class="punto ${clase}"></span>${etiqueta}</span></div>
      ${estado}
      <div class="motivo" style="margin-top:14px"><b>Por qué necesita tu aprobación</b>
        <div class="cifras"><div><span>Descuento propuesto</span><strong>${fmt(-aj)}</strong></div><div><span>Equivale a</span><strong>${pctTxt(Math.abs(aj) / d.valor_venta)} de la venta</strong></div><div><span>Umbral del proyecto</span><strong>${pctTxt(umbralPct)} (${fmt(d.umbral)})</strong></div></div>
        ${r.topado ? `<p style="margin:10px 0 0;font-size:14px">El descuento calculado supera el tope y se limita a ${fmt(r.tope)}.</p>` : ''}</div></section>
    <section class="card linea"><div class="fila-res"><span>El comprador ahorra</span><span class="cifra ahorro">${fmt(Math.abs(aj))}</span></div>
      ${lineaSVG(a, { propuesta: d.propuesta })}
      <ul class="leyenda"><li><span class="sw pag"></span>Pagado</li><li><span class="sw act"></span>Plan actual</li><li><span class="sw pro"></span>Propuesta</li>${a.credito > 0 ? '<li><span class="sw cre"></span>Crédito (recortado)</li>' : ''}</ul></section>
    <section class="card"><table class="tabla"><thead><tr><th colspan="2">Plan actual</th><th colspan="2" class="lado">Propuesta</th></tr><tr><th>Fecha</th><th class="der">Valor</th><th class="lado">Fecha</th><th class="der">Valor</th></tr></thead><tbody>${filas}</tbody>
      <tfoot><tr><td>Total</td><td class="der">${num(d.analisis.saldo + d.analisis.credito)}</td><td class="lado">Total</td><td class="der">${num(r.tot_prop + d.nuevo_credito)}</td></tr></tfoot></table>
      ${d.analisis.vencido > 0 ? `<div class="aviso mora"><p><b>${fmt(d.analisis.vencido)} vencidos</b> (en rojo) se pagan en la primera cuota de la propuesta.</p></div>` : ''}
      ${r.excedente > 0 ? `<div class="aviso cred"><p><b>El crédito pasa de ${fmt(d.valor_credito)} a ${fmt(d.nuevo_credito)}.</b> El comprador debe informar al banco.</p></div>` : ''}</section>
    ${d.firma ? `<section class="card"><h2>Firma del comprador</h2><dl class="datos"><div><dt>Firmante</dt><dd>${esc(d.firma.nombre)}</dd></div><div><dt>Fecha</dt><dd>${fLarga(dia(d.firma.fecha))}</dd></div><div><dt>IP</dt><dd>${esc(d.firma.ip || '—')}</dd></div><div><dt>Código SHA-256</dt><dd class="mono" title="${esc(d.firma.hash)}">${esc(d.firma.hash.slice(0, 16))}…</dd></div></dl></section>` : ''}
    ${decision}</div>`;
  if (UI.devolviendo && UI.foco) { const t = document.getElementById('com'); if (t) { t.focus(); t.setSelectionRange(t.value.length, t.value.length); } UI.foco = false; }
}

/* ═══════════ EVENTOS ═══════════ */
async function decidir(ruta, cuerpo, mensaje) {
  if (UI.ocupado) return; UI.ocupado = true;
  try { await API.post(`/solicitudes/${UI.sel}/${ruta}`, cuerpo); toast(mensaje); UI.devolviendo = false; UI.texto = ''; UI.sel = null; await cargar(); }
  catch (e) { if (e.status === 401) return mostrarError(e); toast(e.message); }
  finally { UI.ocupado = false; }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-sel],[data-act]'); if (!t) return;
  if (t.dataset.tab) { UI.tab = t.dataset.tab; UI.sel = null; UI.devolviendo = false; UI.texto = ''; return cargar().catch(mostrarError); }
  if (t.dataset.sel) { UI.sel = t.dataset.sel; UI.devolviendo = false; UI.texto = ''; render(); return detalle(UI.sel).catch(mostrarError); }
  switch (t.dataset.act) {
    case 'aprobar': decidir('aprobar', undefined, 'Propuesta aprobada. El asesor ya puede cargarla.'); break;
    case 'pedir-dev': UI.devolviendo = true; UI.foco = true; detalle(UI.sel).catch(mostrarError); break;
    case 'cancelar': UI.devolviendo = false; UI.texto = ''; detalle(UI.sel).catch(mostrarError); break;
    case 'devolver': if (UI.texto.trim().length >= 10) decidir('devolver', { comentario: UI.texto.trim() }, 'Propuesta devuelta al asesor.'); break;
  }
});
document.addEventListener('input', e => { if (e.target.id === 'com') { UI.texto = e.target.value; const b = document.querySelector('[data-act=devolver]'); if (b) b.disabled = UI.texto.trim().length < 10; } });

(async () => {
  const u = await exigirSesion(['gerente']);
  if (!u) return;
  pintarCabecera(u, '/app/aprobaciones.html');
  await cargar();
})().catch(mostrarError);
</script>
</body>
</html>
