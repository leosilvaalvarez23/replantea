<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu plan de pagos · Viviendas y Proyectos</title>
<link rel="icon" type="image/svg+xml" href="/app/img/icono-vyp.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#EBF0F2;
  --papel:#FFFFFF;
  --tinta:#17262E;
  --pizarra:#174250;
  --gris:#898E91;
  --gris-suave:#C9D1D5;
  --linea:#D5DDE1;
  --pagado:#A7B4BA;
  --propuesta:#3E87AA;
  --credito:#6F8794;
  --ahorro:#2F7D32;
  --ahorro-fondo:#E4F1E3;
  --sobre:#8E2450;
  --sobre-fondo:#F6E4EC;
  --ambar:#8A5A00;
  --ambar-fondo:#FBF0D5;
  --radio-g:18px;
  --radio-m:10px;
  --radio-p:6px;
  --f-texto:'Onest',system-ui,sans-serif;
  --f-marca:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.5 var(--f-texto);font-variant-numeric:tabular-nums;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pizarra);outline-offset:2px;border-radius:var(--radio-p)}

/* ── encabezado ── */
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:1040px;margin:0 auto}
.logo{height:46px;width:auto;display:block;flex:none}
.top .inmueble{margin-left:auto;text-align:right;font-size:13px;line-height:1.3;color:#4A5D66;white-space:nowrap}
.top .inmueble b{display:block;font-weight:600;color:var(--tinta);font-size:14px}
@media(max-width:480px){.logo{height:40px}.top .inmueble span{display:none}}

/* ── estructura ── */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px;display:grid;gap:16px}
@media(min-width:960px){
  .wrap{max-width:1040px;grid-template-columns:minmax(0,1fr) minmax(0,440px);align-items:start;gap:24px}
  .izq{position:sticky;top:16px;display:grid;gap:16px}
  body{padding-bottom:96px}
}
.izq{display:grid;gap:16px}
.der{display:grid;gap:16px}
.card{background:var(--papel);border-radius:var(--radio-g);padding:20px}
h1,h2{margin:0}
h2{font:700 24px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}

/* ── resultado ── */
.res{border-radius:var(--radio-g);padding:22px 20px 20px;background:var(--papel);border-left:8px solid var(--gris-suave);transition:border-color .25s,background-color .25s}
.res[data-t=ahorro]{border-left-color:var(--ahorro);background:var(--ahorro-fondo)}
.res[data-t=sobre]{border-left-color:var(--sobre);background:var(--sobre-fondo)}
.res .frase{font-size:16px;font-weight:500;margin:0 0 2px}
.res .cifra{font-size:clamp(40px,12vw,60px);line-height:1.05;font-weight:300;letter-spacing:-.02em;margin:0}
.res[data-t=ahorro] .cifra{color:var(--ahorro)}
.res[data-t=sobre] .cifra{color:var(--sobre)}
.res .nota{margin:8px 0 0;font-size:14px;color:#41545D}

/* ── línea de pagos ── */
.linea svg{width:100%;height:auto;display:block;overflow:visible}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#41545D}
.leyenda li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.pag{background:var(--pagado)}
.sw.act{border:2px dashed var(--tinta);background:transparent}
.sw.pro{background:var(--propuesta)}
.sw.cre{background:var(--credito)}
.pie-linea{margin:8px 0 0;font-size:13px;color:#52646C}

/* ── cifras ── */
.cifras{margin:0;display:grid;gap:0}
.cifras div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--linea)}
.cifras div:first-child{border-top:0;padding-top:0}
.cifras dt{font-size:15px;color:#41545D}
.cifras dd{margin:0;font-weight:500;font-size:18px;white-space:nowrap}
.cifras .pagado dd{color:var(--pagado);font-weight:400}
.cifras .total dt{color:var(--tinta);font-weight:500}
.cifras .total dd{font-weight:600;font-size:20px}

/* ── avisos ── */
.aviso{border-radius:var(--radio-m);padding:14px 16px;font-size:14.5px;line-height:1.45}
.aviso b{font-weight:600}
.aviso p{margin:0}
.aviso p+p{margin-top:6px}
.aviso.mora{background:var(--sobre-fondo);color:#5A1735}
.aviso.cred{background:var(--ambar-fondo);color:var(--ambar)}
.aviso.err{background:var(--papel);border:1.5px solid var(--sobre);color:#5A1735}
.aviso.err ul{margin:0;padding-left:18px}

/* ── cuotas ── */
.cab-cuotas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-bottom:6px}
.cab-cuotas .acciones{display:flex;gap:14px;white-space:nowrap}
.txt-btn{background:none;border:0;padding:8px 10px;margin:-8px -4px;color:var(--pizarra);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.tabla{width:100%;border-collapse:collapse}
.tabla th{text-align:left;font-size:13px;font-weight:500;color:#52646C;padding:0 0 8px;border-bottom:2px solid var(--pizarra)}
.tabla th.der,.tabla td.der{text-align:right}
.tabla td{padding:6px 0;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla td:first-child{padding-right:10px}
.tabla td.x{width:44px;text-align:right}
.tabla input{width:100%;min-height:44px;padding:6px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB;font-size:16px}
.tabla input:hover{border-color:var(--gris)}
.tabla input[type=date]{padding-right:6px;font-size:15px}
.tabla input[data-k=valor]{text-align:right;font-weight:500}
.tabla tfoot td,.tabla .fijo td{padding:12px 0;border-bottom:1px solid var(--linea)}
.tabla .fijo td:first-child,.tabla tfoot td:first-child{font-size:15px}
.tabla .cifra-t{white-space:nowrap;padding-right:10px}
.tabla .fijo .cifra-t{font-weight:500;font-size:17px}
.tabla .fijo small{display:block;font-size:12.5px;color:#52646C;font-weight:400}
.tabla .fijo del{color:#52646C}
.tabla tfoot td{border-bottom:0;font-weight:600}
.tabla tfoot .cifra-t{font-size:18px}
.sub-t{margin:14px 0 0;font-size:13px;color:#52646C}

/* ── barra inferior ── */
.barra{position:fixed;inset:auto 0 0 0;background:var(--papel);border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.barra .dentro{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px}
.barra .mini{flex:1;min-width:0;line-height:1.2}
.barra .mini small{display:block;font-size:12.5px;color:#52646C}
.barra .mini strong{font-size:20px;font-weight:600}
.barra .mini[data-t=ahorro] strong{color:var(--ahorro)}
.barra .mini[data-t=sobre] strong{color:var(--sobre)}
.btn{min-height:50px;padding:0 24px;border-radius:var(--radio-m);border:0;background:var(--pizarra);color:#fff;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#0F3340}
.btn:disabled{background:var(--gris-suave);color:#5B6B72;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:var(--radio-m);font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── pasos: revisión, firma, confirmación ── */
.solo{grid-column:1/-1;width:100%;min-width:0;max-width:560px;margin:0 auto;display:grid;gap:16px}
.solo>*{min-width:0}
.titulo{font:700 30px/1.1 var(--f-marca);color:var(--pizarra);margin:4px 0 0;letter-spacing:.01em}
.comp{font-size:13px;table-layout:fixed}
@media(min-width:420px){.comp{font-size:14px}}
.comp td.venc{color:var(--sobre);font-weight:500}
.comp td:nth-child(2),.comp th:nth-child(2){padding-right:8px}
.comp th{border-bottom:0}
.comp thead tr:first-child th{font:700 18px/1.2 var(--f-marca);color:var(--pizarra);padding-bottom:6px}
.comp thead .sub th{font-size:12.5px;border-bottom:2px solid var(--pizarra)}
.comp .lado{padding-left:14px;border-left:1px solid var(--linea)}
.comp td{padding:9px 0}
.comp .sep td{border-top:2px solid var(--linea)}
.comp tfoot td{font-weight:600;padding:11px 0}
.comp td:first-child,.comp td:nth-child(3){padding-right:6px}
.comp td.lado,.comp th.lado{padding-left:12px}
.card.ajustada{padding:18px 12px}
.comp td.lado,.comp th.lado{padding-left:8px}
.pasos{display:flex;gap:8px;margin:0;padding:0;list-style:none;font-size:14px;color:#52646C}
.pasos li{flex:1;padding-top:8px;border-top:4px solid var(--linea)}
.pasos li[aria-current=step]{border-color:var(--pizarra);color:var(--tinta);font-weight:600}
.pasos li.hecho{border-color:var(--propuesta)}
.datos{margin:0 0 16px;display:grid}
.datos div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--linea)}
.datos div:first-child{border-top:0;padding-top:0}
.datos dt{color:#52646C;font-size:14.5px}
.datos dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.datos .hash{font-family:ui-monospace,Consolas,monospace;font-size:14px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.check input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--pizarra)}
.legal{margin:14px 0 0;font-size:13px;color:#52646C}
.campo-otp{display:grid;gap:4px;margin:14px 0}
.campo-otp label{font-size:13px;color:#52646C}
.otp{width:100%;min-height:60px;border:1.5px solid var(--gris);border-radius:var(--radio-m);background:#F8FAFB;text-align:center;font-size:30px;letter-spacing:.35em;font-weight:500;padding-left:.35em}
.firma .aviso{margin-top:12px}
.ok{text-align:center;display:grid;justify-items:center;gap:6px;padding:28px 20px}
.ok p{margin:0}
.sello-ok{width:56px;height:56px;border-radius:50%;background:var(--ahorro);display:grid;place-items:center}
.res-ok{margin-top:10px!important;font-size:18px}
.res-ok[data-t=ahorro] strong{color:var(--ahorro)}
.res-ok[data-t=sobre] strong{color:var(--sobre)}
.res-ok strong{font-weight:600;font-size:22px}
.sigue{margin:12px 0 0;padding-left:22px;display:grid;gap:8px}
.acc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:16px 0 0}
.btn.sec{background:var(--papel);color:var(--pizarra);border:2px solid var(--pizarra)}
.btn.sec:hover{background:var(--fondo)!important}
@media print{.barra,.txt-btn,.acc,.toast{display:none!important}body{background:#fff;padding:0}.card,.res{break-inside:avoid}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.res.calc{opacity:.55}
.vacio{padding:48px 16px;text-align:center;color:#41545D}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="/app/img/logo-vyp.svg" alt="Viviendas y Proyectos, bien hechos">
  <div class="inmueble" id="inmueble"></div>
</header>

<main class="wrap" id="app" aria-live="polite"><div class="solo"><p class="vacio">Cargando tu propuesta…</p></div></main>

<div class="barra" hidden>
  <div class="dentro">
    <div class="mini" id="mini"></div>
    <button class="btn" id="btnFirmar" type="button">Revisar y firmar</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="/app/motor.js"></script>
<script src="/app/api.js"></script>
<script>
/* El cálculo lo hace el servidor: aquí solo se muestra y se edita. Las tasas nunca llegan al navegador. */
const TOKEN = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
const S = { paso: 'cargando', datos: null, A: null, reglas: null, propuesta: [], inicial: [], res: null, resOk: false, v: 0, errorEval: '', firma: null,
  f: { acepto: false, paso: 1, enviadoA: '', codigoPrueba: null, code: '', error: '', ocupado: false } };

const dmyc = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };
const adaptar = an => ({ recaudo: an.recaudo, pend: an.pendiente, credito: an.credito, fechaCredito: an.fecha_credito,
  saldo: an.saldo, vencido: an.vencido, mora: an.mora, totRec: an.pagado, fechaLimite: an.fecha_limite });
const orden = () => [...S.propuesta].sort((x, y) => x.fecha.localeCompare(y.fecha));
const items = () => S.propuesta.map(p => ({ fecha: p.fecha, valor: p.valor, concepto: p.concepto, abono: !!p.abono, fijo: !!p.fijo, orig: p.orig ?? null, orig_fecha: p.orig_fecha ?? null }));
const copia = lista => lista.map(p => ({ ...p, id: nid() }));

/* ═══════════ CÁLCULO LOCAL (solo lo inmediato) Y RESULTADO DEL SERVIDOR ═══════════ */
// Lo que no necesita el motor se calcula al instante; el resultado financiero lo trae el servidor.
function c() {
  const totProp = S.propuesta.reduce((t, p) => t + p.valor, 0), dif = Math.round(S.A.saldo - totProp);
  const excedente = Math.max(0, -dif), nuevoCred = Math.max(0, S.datos.valor_credito - excedente);
  const r = S.res || { ajuste: 0, topado: false, tope: 0, requiere_aprobacion: false, errores: [] };
  let errores = S.resOk ? r.errores : (dif > 1 ? [`Faltan ${fmt(dif)} por asignar a las cuotas.`] : []);
  if (!S.resOk && S.errorEval) errores = [S.errorEval];
  return { totProp, dif, excedente, nuevoCred, r, errores, listo: S.resOk && r.valido };
}
const tipoDe = r => { const aj = r.ajuste; return { aj, tipo: aj <= -1 ? 'ahorro' : aj >= 1 ? 'sobre' : 'neutro' }; };

function cambio() {            // la propuesta cambió: se pide el resultado al servidor sin pisar lo que el comprador sigue escribiendo
  S.v++; S.resOk = false; S.errorEval = '';
  clearTimeout(S.t); S.t = setTimeout(evaluar, 250);
}
async function evaluar() {
  const v = S.v;
  try { const r = await API.post(`/comprador/${TOKEN}/evaluar`, { propuesta: items() }); if (v !== S.v) return; S.res = r; S.resOk = true; S.errorEval = ''; }
  catch (e) { if (v !== S.v) return; if ([404, 409, 410].includes(e.status)) return errorDeLink(e); S.resOk = false; S.errorEval = e.message; }
  if (S.paso === 'simular') renderSim();
}
function rebalancear() {
  const libres = S.propuesta.filter(p => !p.fijo).sort((a, b) => a.fecha.localeCompare(b.fecha));
  if (!libres.length) return;
  const totFijos = S.propuesta.filter(p => p.fijo).reduce((t, p) => t + p.valor, 0);
  const saldo = Math.max(0, S.A.saldo - totFijos), base = Math.floor(saldo / libres.length);
  for (let i = 0; i < libres.length - 1; i++) libres[i].valor = base;
  libres[libres.length - 1].valor = Math.round(saldo - base * (libres.length - 1));
}

/* ═══════════ NAVEGACIÓN ═══════════ */
function setBar(html, tipo, texto, disabled, fn) {
  $('.barra').hidden = false; const m = $('#mini'); m.dataset.t = tipo || ''; m.innerHTML = html;
  const b = $('#btnFirmar'); b.textContent = texto; b.disabled = !!disabled; S.onBar = fn;
}
function ir(p) { S.paso = p; render(); window.scrollTo(0, 0); }
function render() { ({ simular: renderSim, revisar: renderRev, firma: renderFirma, listo: renderListo })[S.paso](); }
function cabecera() { $('#inmueble').innerHTML = `<b>${esc(S.datos.inmueble)}</b><span>Valor de venta ${fmtM(S.datos.valor_venta)}</span>`; }
const resumenBarra = tipo => tipo === 'ahorro' ? 'Ahorras' : tipo === 'sobre' ? 'Pagas de más' : 'Sin cambio en el valor';

function errorDeLink(e) {
  $('.barra').hidden = true;
  const msg = e.status === 410 ? 'Este link venció. Pídele a tu asesor uno nuevo.'
    : e.status === 404 ? 'Este link no existe. Revisa que lo hayas copiado completo o pídele a tu asesor uno nuevo.'
    : e.status === 409 ? 'Esta propuesta ya fue firmada.' : e.message;
  $('#app').innerHTML = `<div class="solo"><section class="card ok"><h1 class="titulo">${e.status === 409 ? 'Propuesta firmada' : 'No pudimos abrir tu propuesta'}</h1><p>${esc(msg)}</p></section></div>`;
}

/* ═══════════ 1. SIMULADOR ═══════════ */
function renderSim() {
  const a = S.A, k = c(), { aj, tipo } = tipoDe(k.r);
  const frase = tipo === 'ahorro' ? 'Con esta propuesta ahorras' : tipo === 'sobre' ? 'Con esta propuesta pagas de más' : 'Esta propuesta no cambia el valor de tu plan';
  const nota = k.r.topado ? `El descuento se limita al tope del proyecto (${fmt(k.r.tope)}).`
    : tipo === 'ahorro' ? 'Es el descuento por adelantar pagos frente a tu plan actual.'
    : tipo === 'sobre' ? 'Es el cargo financiero por aplazar pagos frente a tu plan actual.' : 'Mueve fechas o valores para ver el efecto.';
  const hayAbonos = S.propuesta.some(p => p.abono), cols = hayAbonos ? 3 : 2;
  const min = S.reglas.hoy, max = a.fechaLimite || '';
  const filas = orden().map(p => `<tr data-id="${p.id}">
      <td><input aria-label="${p.abono ? 'Fecha del abono' : 'Fecha de la cuota'}" id="f-${p.id}" type="date" value="${p.fecha}" min="${min}" ${max ? `max="${max}"` : ''} data-k="fecha"></td>
      <td class="der"><input aria-label="Valor" id="v-${p.id}" inputmode="numeric" value="${num(p.valor)}" data-k="valor"></td>
      ${hayAbonos ? `<td class="x">${p.abono ? `<button class="txt-btn" data-del="${p.id}" type="button" aria-label="Quitar abono">✕</button>` : ''}</td>` : ''}</tr>`).join('');
  const credCambia = k.excedente > 0 && a.credito > 0;
  const filaCred = a.credito > 0 ? `<tr class="fijo"><td>Crédito hipotecario<small>${dmy(a.fechaCredito)}</small></td>
      <td class="der cifra-t" colspan="${cols - 1}">${credCambia ? `<small><del>${fmt(S.datos.valor_credito)}</del></small>` : ''}${fmt(k.nuevoCred)}</td></tr>` : '';
  const moraHTML = a.mora > 0 || a.vencido > 0 ? `<div class="aviso mora">
      ${a.vencido > 0 ? `<p><b>Tienes ${fmt(a.vencido)} vencidos.</b> Se pagan en tu primera cuota, por eso su valor es mayor.</p>` : ''}
      ${a.mora > 0 ? `<p>Mora causada: <b>${fmt(a.mora)}</b>. La liquida IngeMAX y se cobra aparte; no se suma otra vez al cálculo.</p>` : ''}</div>` : '';
  const credHTML = k.excedente > 0 ? `<div class="aviso cred"><p><b>Tu propuesta supera la cuota inicial en ${fmt(k.excedente)}.</b></p>
      <p>Ese valor se abona al crédito: pasa de ${fmt(S.datos.valor_credito)} a ${fmt(k.nuevoCred)}. Debes informar el cambio a tu banco.</p></div>` : '';
  const errHTML = k.errores.length ? `<div class="aviso err" role="alert"><p><b>Para continuar</b></p><ul>${k.errores.map(e => `<li>${esc(e)}</li>`).join('')}</ul></div>` : '';

  const act = document.activeElement, foco = act && act.id;       // conserva el foco al volver a dibujar
  cabecera();
  $('#app').innerHTML = `
  <div class="izq">
    <section class="res ${S.resOk ? '' : 'calc'}" data-t="${tipo}" aria-label="Resultado" ${S.resOk ? '' : 'aria-busy="true"'}>
      <p class="frase">${frase}</p><p class="cifra">${tipo === 'neutro' ? '$ 0' : fmt(Math.abs(aj))}</p><p class="nota">${nota}</p>
    </section>
    <section class="card linea" aria-label="Línea de pagos">
      ${lineaSVG(a, { propuesta: S.propuesta })}
      <ul class="leyenda"><li><span class="sw pag"></span>Pagado</li><li><span class="sw act"></span>Plan actual</li><li><span class="sw pro"></span>Tu propuesta</li>${a.credito > 0 ? '<li><span class="sw cre"></span>Crédito (recortado)</li>' : ''}</ul>
    </section>
    <section class="card" aria-label="Resumen">
      <dl class="cifras">
        <div class="pagado"><dt>Ya pagaste</dt><dd>${fmt(a.totRec)}</dd></div>
        <div><dt>Te falta de la cuota inicial</dt><dd>${fmt(a.saldo)}</dd></div>
        <div class="total"><dt>Tu propuesta suma</dt><dd>${fmt(k.totProp)}</dd></div>
        ${a.credito > 0 ? `<div><dt>Crédito hipotecario</dt><dd>${credCambia ? `<small style="font-weight:400;font-size:13px;color:#52646C"><del>${fmt(S.datos.valor_credito)}</del></small> ` : ''}${fmt(k.nuevoCred)}</dd></div>` : ''}
      </dl>
    </section>
  </div>
  <div class="der">
    ${moraHTML}${credHTML}
    <section class="card" aria-label="Cuotas">
      <div class="cab-cuotas"><h2>Tus cuotas</h2>
        <div class="acciones"><button class="txt-btn" id="btnAbono" type="button">Agregar abono</button><button class="txt-btn" id="btnReset" type="button">Restablecer</button></div></div>
      <table class="tabla">
        <thead><tr><th scope="col">Fecha</th><th scope="col" class="der">Valor</th>${hayAbonos ? '<th scope="col"><span class="sr">Acciones</span></th>' : ''}</tr></thead>
        <tbody>${filas}${filaCred}</tbody>
        <tfoot><tr><td>Total por pagar</td><td class="der cifra-t" colspan="${cols - 1}">${fmt(k.totProp + k.nuevoCred)}</td></tr></tfoot>
      </table>
    </section>
    ${errHTML}
  </div>`;
  setBar(`<small>${resumenBarra(tipo)}</small><strong>${tipo === 'neutro' ? '$ 0' : fmt(Math.abs(aj))}</strong>`, tipo, 'Revisar y firmar', !k.listo, () => ir('revisar'));
  if (foco) { const el = document.getElementById(foco); if (el) el.focus(); }
}

/* ═══════════ 2. REVISIÓN ═══════════ */
function renderRev() {
  const a = S.A, k = c(), { aj, tipo } = tipoDe(k.r);
  const izq = [...a.pend].sort((x, y) => x.fecha.localeCompare(y.fecha)), der = orden(), v = izq.filter(p => p.vencida).length;
  const n = Math.max(izq.length, v + der.length); let filas = '';
  for (let i = 0; i < n; i++) {
    const l = izq[i], r = i >= v ? der[i - v] : null;
    filas += `<tr><td${l && l.vencida ? ' class="venc"' : ''}>${l ? dmyc(l.fecha) : ''}</td><td class="der${l && l.vencida ? ' venc' : ''}">${l ? num(l.valor) : ''}</td>
      <td class="lado">${r ? dmyc(r.fecha) : ''}</td><td class="der">${r ? num(r.valor) : ''}</td></tr>`;
  }
  const cred = a.credito > 0 ? `<tr class="sep"><td>Crédito</td><td class="der">${num(a.credito)}</td><td class="lado">Crédito</td><td class="der">${num(k.nuevoCred)}</td></tr>` : '';
  const avisos = [
    a.vencido > 0 ? `<div class="aviso mora"><p><b>Tus ${fmt(a.vencido)} vencidos</b> se pagan en la primera cuota de tu propuesta.</p>${a.mora > 0 ? `<p>La mora causada (${fmt(a.mora)}) la liquida IngeMAX por separado.</p>` : ''}</div>` : '',
    k.excedente > 0 ? `<div class="aviso cred"><p><b>Tu crédito hipotecario pasa de ${fmt(S.datos.valor_credito)} a ${fmt(k.nuevoCred)}.</b></p><p>Debes informar este cambio a tu banco.</p></div>` : '',
    k.r.requiere_aprobacion ? `<div class="aviso cred"><p><b>Gerencia debe aprobar tu propuesta.</b> Por el valor del descuento, la aprobación es previa a que se cargue el nuevo plan.</p></div>` : ''].join('');
  cabecera();
  $('#app').innerHTML = `<div class="solo">
    <h1 class="titulo">Revisa tu propuesta</h1>
    <section class="res" data-t="${tipo}" aria-label="Resultado"><p class="frase">${tipo === 'ahorro' ? 'Con esta propuesta ahorras' : tipo === 'sobre' ? 'Con esta propuesta pagas de más' : 'Esta propuesta no cambia el valor de tu plan'}</p><p class="cifra">${tipo === 'neutro' ? '$ 0' : fmt(Math.abs(aj))}</p></section>
    <section class="card ajustada" aria-label="Comparación">
      <table class="tabla comp">
        <colgroup><col style="width:19%"><col style="width:31%"><col style="width:19%"><col style="width:31%"></colgroup>
        <thead><tr><th colspan="2" scope="colgroup">Plan actual</th><th colspan="2" scope="colgroup" class="lado">Tu propuesta</th></tr>
          <tr class="sub"><th>Fecha</th><th class="der">Valor</th><th class="lado">Fecha</th><th class="der">Valor</th></tr></thead>
        <tbody>${filas}${cred}</tbody>
        <tfoot><tr><td>Total</td><td class="der">${num(a.saldo + a.credito)}</td><td class="lado">Total</td><td class="der">${num(k.totProp + k.nuevoCred)}</td></tr></tfoot>
      </table>
      ${a.vencido > 0 ? '<p class="sub-t">En rojo, las cuotas vencidas: se pagan en la primera cuota de tu propuesta.</p>' : ''}
    </section>
    ${avisos}
    <p><button class="txt-btn" data-act="editar" type="button">Volver a editar</button></p>
  </div>`;
  setBar(`<small>${resumenBarra(tipo)}</small><strong>${tipo === 'neutro' ? '$ 0' : fmt(Math.abs(aj))}</strong>`, tipo, 'Continuar a firmar', false,
    () => { S.f = { acepto: false, paso: 1, enviadoA: '', codigoPrueba: null, code: '', error: '', ocupado: false }; ir('firma'); });
}

/* ═══════════ 3. FIRMA ═══════════ */
function renderFirma() {
  const f = S.f, P = S.datos.comprador;
  const pasos = `<ol class="pasos"><li class="${f.paso > 1 ? 'hecho' : ''}" ${f.paso === 1 ? 'aria-current="step"' : ''}>1. Aceptar</li><li ${f.paso === 2 ? 'aria-current="step"' : ''}>2. Código</li></ol>`;
  const err = f.error ? `<div class="aviso err" role="alert"><p>${esc(f.error)}</p></div>` : '';
  const cuerpo = f.paso === 1 ? `
    <dl class="datos"><div><dt>Firmante</dt><dd>${esc(P.nombre)}</dd></div><div><dt>Documento</dt><dd>${esc(P.documento)}</dd></div><div><dt>Correo</dt><dd>${esc(P.correo)}</dd></div></dl>
    <label class="check"><input type="checkbox" id="acepto" ${f.acepto ? 'checked' : ''}><span>Acepto firmar electrónicamente esta propuesta de plan de pagos y autorizo el tratamiento de mis datos personales para este trámite.</span></label>
    <p class="legal">La firma electrónica tiene validez legal según la Ley 527 de 1999 y el Decreto 2364 de 2012. Tus datos se tratan conforme a la Ley 1581 de 2012.</p>${err}`
  : `<p>Enviamos un código de 6 dígitos a <b>${esc(f.enviadoA)}</b>. Escríbelo para firmar.</p>
    <div class="campo-otp"><label for="otp">Código de verificación</label>
      <input id="otp" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" value="${esc(f.code)}"></div>
    ${err}
    ${f.codigoPrueba ? `<div class="aviso cred"><p><b>Ambiente de pruebas:</b> el correo no se envía. Tu código es <b>${esc(f.codigoPrueba)}</b>.</p></div>` : ''}
    <p><button class="txt-btn" data-act="reenviar" type="button" ${f.ocupado ? 'disabled' : ''}>Enviar un código nuevo</button></p>`;
  cabecera();
  $('#app').innerHTML = `<div class="solo"><h1 class="titulo">Firma tu propuesta</h1>${pasos}<section class="card firma">${cuerpo}</section>
    <p><button class="txt-btn" data-act="${f.paso === 1 ? 'revisar' : 'paso1'}" type="button">${f.paso === 1 ? 'Volver a la revisión' : 'Volver al paso 1'}</button></p></div>`;
  if (f.paso === 1) setBar('<small>Siguiente</small><strong>Código</strong>', '', f.ocupado ? 'Enviando…' : 'Enviar código', !f.acepto || f.ocupado, pedirCodigo);
  else setBar('<small>Último paso</small><strong>Firma</strong>', '', f.ocupado ? 'Firmando…' : 'Firmar propuesta', f.code.length !== 6 || f.ocupado, firmar);
}
async function pedirCodigo() {
  const f = S.f; if (f.ocupado) return; f.ocupado = true; f.error = ''; renderFirma();
  try {
    const r = await API.post(`/comprador/${TOKEN}/codigo`, { propuesta: items() });
    f.enviadoA = r.enviado_a; f.codigoPrueba = r.codigo_prueba; f.paso = 2; f.code = '';
  } catch (e) {
    if ([404, 409, 410].includes(e.status)) { f.ocupado = false; return errorDeLink(e); }
    f.error = e.errores && e.errores.length ? e.errores.join(' ') : e.message;
  }
  f.ocupado = false; renderFirma(); window.scrollTo(0, 0);
}
async function firmar() {
  const f = S.f; if (f.ocupado) return; f.ocupado = true; f.error = ''; renderFirma();
  try {
    const r = await API.post(`/comprador/${TOKEN}/firmar`, { propuesta: items(), codigo: f.code, acepta: f.acepto });
    S.firma = { hash: r.hash, fecha: r.firmada_en, ajuste: r.ajuste, requiere_aprobacion: r.requiere_aprobacion };
    f.ocupado = false; return ir('listo');
  } catch (e) {
    if ([404, 409, 410].includes(e.status)) { f.ocupado = false; return errorDeLink(e); }
    f.error = e.errores && e.errores.length ? e.errores.join(' ') : e.message;
  }
  f.ocupado = false; renderFirma();
  const el = $('#otp'); if (el) el.focus();
}

/* ═══════════ 4. CONFIRMACIÓN ═══════════ */
function renderListo() {
  const F = S.firma, aj = F.ajuste, tipo = aj <= -1 ? 'ahorro' : aj >= 1 ? 'sobre' : 'neutro';
  const cuando = new Date(F.fecha).toLocaleString('es-CO', { day: 'numeric', month: 'long', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const sigue = [F.requiere_aprobacion ? 'Gerencia revisa y aprueba tu propuesta.' : null, 'Tu asesor carga el nuevo plan en IngeMAX.', 'Verificamos que el plan cargado coincida con lo que firmaste.'].filter(Boolean);
  $('.barra').hidden = true; cabecera();
  $('#app').innerHTML = `<div class="solo">
    <section class="card ok" aria-label="Firma completada">
      <span class="sello-ok" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <h1 class="titulo">Propuesta firmada</h1><p>${esc(cuando)}</p>
      <p class="res-ok" data-t="${tipo}">${resumenBarra(tipo)}${tipo === 'neutro' ? '' : ' <strong>' + fmt(Math.abs(aj)) + '</strong>'}</p>
    </section>
    <section class="card"><h2>Qué sigue</h2><ol class="sigue">${sigue.map(t => `<li>${t}</li>`).join('')}</ol></section>
    <section class="card"><h2>Comprobante</h2>
      <dl class="datos"><div><dt>Firmante</dt><dd>${esc(S.datos.comprador.nombre)}</dd></div><div><dt>Inmueble</dt><dd>${esc(S.datos.inmueble)}</dd></div>
        <div><dt>Código de verificación</dt><dd class="hash">${esc(F.hash.slice(0, 16))}…</dd></div></dl>
      <p class="acc"><button class="btn sec" data-act="imprimir" type="button">Guardar como PDF</button><button class="txt-btn" data-act="hash" type="button">Copiar código completo</button></p>
    </section></div>`;
}

/* ═══════════ EVENTOS ═══════════ */
$('#app').addEventListener('change', e => {
  if (e.target.id === 'acepto') { S.f.acepto = e.target.checked; $('#btnFirmar').disabled = !S.f.acepto; return; }
  const row = e.target.closest('tr[data-id]'); if (!row) return;
  const p = S.propuesta.find(x => x.id === row.dataset.id); if (!p) return;
  if (e.target.dataset.k === 'fecha' && e.target.value) p.fecha = e.target.value;
  if (e.target.dataset.k === 'valor') { p.valor = parseNum(e.target.value); p.fijo = true; rebalancear(); }
  cambio(); renderSim();
});
$('#app').addEventListener('click', async e => {
  const t = e.target;
  if (t.id === 'btnReset') { S.propuesta = copia(S.inicial); cambio(); renderSim(); toast('Plan restablecido'); return; }
  if (t.id === 'btnAbono') {
    const f = addM(1, 15), fecha = f < S.reglas.hoy || (S.A.fechaLimite && f > S.A.fechaLimite) ? S.reglas.hoy : f;
    S.propuesta.push({ id: nid(), fecha, concepto: S.reglas.concepto_abono, valor: S.reglas.cuota_min, fijo: true, abono: true });
    rebalancear(); cambio(); renderSim(); return;
  }
  if (t.dataset.del) { S.propuesta = S.propuesta.filter(p => p.id !== t.dataset.del); rebalancear(); cambio(); renderSim(); return; }
  const act = t.dataset.act; if (!act) return;
  if (act === 'editar') ir('simular');
  if (act === 'revisar') ir('revisar');
  if (act === 'paso1') { S.f.paso = 1; S.f.error = ''; renderFirma(); }
  if (act === 'reenviar') { await pedirCodigo(); if (!S.f.error) toast('Enviamos un código nuevo.'); }
  if (act === 'imprimir') window.print();
  if (act === 'hash') { try { await navigator.clipboard.writeText(S.firma.hash); toast('Código copiado.'); } catch (err) { toast('No se pudo copiar. Selecciónalo y cópialo a mano.'); } }
});
$('#app').addEventListener('input', e => {
  if (e.target.id === 'otp') { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); S.f.code = e.target.value; $('#btnFirmar').disabled = S.f.code.length !== 6 || S.f.ocupado; }
});
$('#btnFirmar').addEventListener('click', () => S.onBar && S.onBar());

/* ═══════════ INICIO ═══════════ */
(async function iniciar() {
  try {
    const d = await API.get('/comprador/' + encodeURIComponent(TOKEN));
    S.datos = d;
    if (d.estado_ui !== 'enviada') {      // ya firmada (o en otro punto del trámite): se muestra el comprobante
      S.firma = { hash: d.firma.hash, fecha: d.firma.fecha, ajuste: d.firma.ajuste, requiere_aprobacion: d.firma.requiere_aprobacion };
      S.paso = 'listo'; return render();
    }
    S.A = adaptar(d.analisis); S.reglas = d.reglas;
    S.propuesta = copia(d.propuesta); S.inicial = copia(d.propuesta);
    S.res = d.resultado; S.resOk = true; S.paso = 'simular';
    render();
  } catch (e) { errorDeLink(e); }
})();
</script>
</body>
</html>
