<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tu plan de pagos · Viviendas y Proyectos</title>
<link rel="icon" type="image/svg+xml" href="img/icono-vyp.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#EBF0F2;
  --papel:#FFFFFF;
  --tinta:#17262E;
  --pizarra:#174250;
  --gris:#898E91;
  --gris-suave:#C9D1D5;
  --linea:#D5DDE1;
  --pagado:#A7B4BA;
  --propuesta:#3E87AA;
  --credito:#6F8794;
  --ahorro:#2F7D32;
  --ahorro-fondo:#E4F1E3;
  --sobre:#8E2450;
  --sobre-fondo:#F6E4EC;
  --ambar:#8A5A00;
  --ambar-fondo:#FBF0D5;
  --radio-g:18px;
  --radio-m:10px;
  --radio-p:6px;
  --f-texto:'Onest',system-ui,sans-serif;
  --f-marca:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 16px/1.5 var(--f-texto);font-variant-numeric:tabular-nums;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pizarra);outline-offset:2px;border-radius:var(--radio-p)}

/* ── encabezado ── */
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:1040px;margin:0 auto}
.logo{height:46px;width:auto;display:block;flex:none}
.top .inmueble{margin-left:auto;text-align:right;font-size:13px;line-height:1.3;color:#4A5D66;white-space:nowrap}
.top .inmueble b{display:block;font-weight:600;color:var(--tinta);font-size:14px}
@media(max-width:480px){.logo{height:40px}.top .inmueble span{display:none}}

/* ── estructura ── */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 24px;display:grid;gap:16px}
@media(min-width:960px){
  .wrap{max-width:1040px;grid-template-columns:minmax(0,1fr) minmax(0,440px);align-items:start;gap:24px}
  .izq{position:sticky;top:16px;display:grid;gap:16px}
  body{padding-bottom:96px}
}
.izq{display:grid;gap:16px}
.der{display:grid;gap:16px}
.card{background:var(--papel);border-radius:var(--radio-g);padding:20px}
h1,h2{margin:0}
h2{font:700 24px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}

/* ── resultado ── */
.res{border-radius:var(--radio-g);padding:22px 20px 20px;background:var(--papel);border-left:8px solid var(--gris-suave);transition:border-color .25s,background-color .25s}
.res[data-t=ahorro]{border-left-color:var(--ahorro);background:var(--ahorro-fondo)}
.res[data-t=sobre]{border-left-color:var(--sobre);background:var(--sobre-fondo)}
.res .frase{font-size:16px;font-weight:500;margin:0 0 2px}
.res .cifra{font-size:clamp(40px,12vw,60px);line-height:1.05;font-weight:300;letter-spacing:-.02em;margin:0}
.res[data-t=ahorro] .cifra{color:var(--ahorro)}
.res[data-t=sobre] .cifra{color:var(--sobre)}
.res .nota{margin:8px 0 0;font-size:14px;color:#41545D}

/* ── línea de pagos ── */
.linea svg{width:100%;height:auto;display:block;overflow:visible}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#41545D}
.leyenda li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.pag{background:var(--pagado)}
.sw.act{border:2px dashed var(--tinta);background:transparent}
.sw.pro{background:var(--propuesta)}
.sw.cre{background:var(--credito)}
.pie-linea{margin:8px 0 0;font-size:13px;color:#52646C}

/* ── cifras ── */
.cifras{margin:0;display:grid;gap:0}
.cifras div{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:11px 0;border-top:1px solid var(--linea)}
.cifras div:first-child{border-top:0;padding-top:0}
.cifras dt{font-size:15px;color:#41545D}
.cifras dd{margin:0;font-weight:500;font-size:18px;white-space:nowrap}
.cifras .pagado dd{color:var(--pagado);font-weight:400}
.cifras .total dt{color:var(--tinta);font-weight:500}
.cifras .total dd{font-weight:600;font-size:20px}

/* ── avisos ── */
.aviso{border-radius:var(--radio-m);padding:14px 16px;font-size:14.5px;line-height:1.45}
.aviso b{font-weight:600}
.aviso p{margin:0}
.aviso p+p{margin-top:6px}
.aviso.mora{background:var(--sobre-fondo);color:#5A1735}
.aviso.cred{background:var(--ambar-fondo);color:var(--ambar)}
.aviso.err{background:var(--papel);border:1.5px solid var(--sobre);color:#5A1735}
.aviso.err ul{margin:0;padding-left:18px}

/* ── cuotas ── */
.cab-cuotas{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin-bottom:6px}
.cab-cuotas .acciones{display:flex;gap:14px;white-space:nowrap}
.txt-btn{background:none;border:0;padding:8px 10px;margin:-8px -4px;color:var(--pizarra);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:44px}
.tabla{width:100%;border-collapse:collapse}
.tabla th{text-align:left;font-size:13px;font-weight:500;color:#52646C;padding:0 0 8px;border-bottom:2px solid var(--pizarra)}
.tabla th.der,.tabla td.der{text-align:right}
.tabla td{padding:6px 0;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla td:first-child{padding-right:10px}
.tabla td.x{width:44px;text-align:right}
.tabla input{width:100%;min-height:44px;padding:6px 10px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB;font-size:16px}
.tabla input:hover{border-color:var(--gris)}
.tabla input[type=date]{padding-right:6px;font-size:15px}
.tabla input[data-k=valor]{text-align:right;font-weight:500}
.tabla tfoot td,.tabla .fijo td{padding:12px 0;border-bottom:1px solid var(--linea)}
.tabla .fijo td:first-child,.tabla tfoot td:first-child{font-size:15px}
.tabla .cifra-t{white-space:nowrap;padding-right:10px}
.tabla .fijo .cifra-t{font-weight:500;font-size:17px}
.tabla .fijo small{display:block;font-size:12.5px;color:#52646C;font-weight:400}
.tabla .fijo del{color:#52646C}
.tabla tfoot td{border-bottom:0;font-weight:600}
.tabla tfoot .cifra-t{font-size:18px}
.sub-t{margin:14px 0 0;font-size:13px;color:#52646C}

/* ── barra inferior ── */
.barra{position:fixed;inset:auto 0 0 0;background:var(--papel);border-top:1px solid var(--linea);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.barra .dentro{max-width:1040px;margin:0 auto;display:flex;align-items:center;gap:16px}
.barra .mini{flex:1;min-width:0;line-height:1.2}
.barra .mini small{display:block;font-size:12.5px;color:#52646C}
.barra .mini strong{font-size:20px;font-weight:600}
.barra .mini[data-t=ahorro] strong{color:var(--ahorro)}
.barra .mini[data-t=sobre] strong{color:var(--sobre)}
.btn{min-height:50px;padding:0 24px;border-radius:var(--radio-m);border:0;background:var(--pizarra);color:#fff;font-weight:600;font-size:16px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#0F3340}
.btn:disabled{background:var(--gris-suave);color:#5B6B72;cursor:not-allowed}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 16px;border-radius:var(--radio-m);font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9;text-align:center}
.toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ── pasos: revisión, firma, confirmación ── */
.solo{grid-column:1/-1;width:100%;min-width:0;max-width:560px;margin:0 auto;display:grid;gap:16px}
.solo>*{min-width:0}
.titulo{font:700 30px/1.1 var(--f-marca);color:var(--pizarra);margin:4px 0 0;letter-spacing:.01em}
.comp{font-size:13px;table-layout:fixed}
@media(min-width:420px){.comp{font-size:14px}}
.comp td.venc{color:var(--sobre);font-weight:500}
.comp td:nth-child(2),.comp th:nth-child(2){padding-right:8px}
.comp th{border-bottom:0}
.comp thead tr:first-child th{font:700 18px/1.2 var(--f-marca);color:var(--pizarra);padding-bottom:6px}
.comp thead .sub th{font-size:12.5px;border-bottom:2px solid var(--pizarra)}
.comp .lado{padding-left:14px;border-left:1px solid var(--linea)}
.comp td{padding:9px 0}
.comp .sep td{border-top:2px solid var(--linea)}
.comp tfoot td{font-weight:600;padding:11px 0}
.comp td:first-child,.comp td:nth-child(3){padding-right:6px}
.comp td.lado,.comp th.lado{padding-left:12px}
.card.ajustada{padding:18px 12px}
.comp td.lado,.comp th.lado{padding-left:8px}
.pasos{display:flex;gap:8px;margin:0;padding:0;list-style:none;font-size:14px;color:#52646C}
.pasos li{flex:1;padding-top:8px;border-top:4px solid var(--linea)}
.pasos li[aria-current=step]{border-color:var(--pizarra);color:var(--tinta);font-weight:600}
.pasos li.hecho{border-color:var(--propuesta)}
.datos{margin:0 0 16px;display:grid}
.datos div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--linea)}
.datos div:first-child{border-top:0;padding-top:0}
.datos dt{color:#52646C;font-size:14.5px}
.datos dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.datos .hash{font-family:ui-monospace,Consolas,monospace;font-size:14px}
.check{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15.5px}
.check input{width:24px;height:24px;flex:none;margin:1px 0 0;accent-color:var(--pizarra)}
.legal{margin:14px 0 0;font-size:13px;color:#52646C}
.campo-otp{display:grid;gap:4px;margin:14px 0}
.campo-otp label{font-size:13px;color:#52646C}
.otp{width:100%;min-height:60px;border:1.5px solid var(--gris);border-radius:var(--radio-m);background:#F8FAFB;text-align:center;font-size:30px;letter-spacing:.35em;font-weight:500;padding-left:.35em}
.firma .aviso{margin-top:12px}
.ok{text-align:center;display:grid;justify-items:center;gap:6px;padding:28px 20px}
.ok p{margin:0}
.sello-ok{width:56px;height:56px;border-radius:50%;background:var(--ahorro);display:grid;place-items:center}
.res-ok{margin-top:10px!important;font-size:18px}
.res-ok[data-t=ahorro] strong{color:var(--ahorro)}
.res-ok[data-t=sobre] strong{color:var(--sobre)}
.res-ok strong{font-weight:600;font-size:22px}
.sigue{margin:12px 0 0;padding-left:22px;display:grid;gap:8px}
.acc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin:16px 0 0}
.btn.sec{background:var(--papel);color:var(--pizarra);border:2px solid var(--pizarra)}
.btn.sec:hover{background:var(--fondo)!important}
@media print{.barra,.txt-btn,.acc,.toast{display:none!important}body{background:#fff;padding:0}.card,.res{break-inside:avoid}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>

<header class="top">
  <img class="logo" src="img/logo-vyp.svg" alt="Viviendas y Proyectos, bien hechos">
  <div class="inmueble" id="inmueble"></div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>

<div class="barra">
  <div class="dentro">
    <div class="mini" id="mini"></div>
    <button class="btn" id="btnFirmar" type="button">Revisar y firmar</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* ═══════════ MOTOR (igual al del prototipo y a engine/engine.py) ═══════════ */
const Engine=(()=>{
  const parse=s=>{const [y,m,d]=s.split('-').map(Number);return{y,m,d}};
  const isLastFeb=({y,m,d})=>m===2&&d===new Date(Date.UTC(y,2,0)).getUTCDate();
  function days360(a,b){const A=parse(a),B=parse(b);let d1=A.d,d2=B.d;
    if(isLastFeb(A)&&isLastFeb(B))d2=30;if(isLastFeb(A))d1=30;
    if(d2===31&&d1>=30)d2=30;if(d1===31)d1=30;
    return(B.y-A.y)*360+(B.m-A.m)*30+(d2-d1)}
  const daysActual=(a,b)=>(Date.parse(b)-Date.parse(a))/86400000;
  function timeline(pactado,pagos){const map=new Map();
    for(const p of pactado){const r=map.get(p.fecha)||{fecha:p.fecha,D:0,F:0};r.D+=p.valor;map.set(p.fecha,r)}
    for(const p of pagos){const r=map.get(p.fecha)||{fecha:p.fecha,D:0,F:0};r.F+=p.valor;map.set(p.fecha,r)}
    return[...map.values()].sort((a,b)=>a.fecha.localeCompare(b.fecha))}
  function liquidacion(pactado,pagos,tasaCia,tasaCliente){
    const rows=timeline(pactado,pagos);let I=0,J=0,totalH=0;
    rows.forEach((r,k)=>{let H=0;
      if(k===0){I=(0<r.F)?0:-r.F;if(I<0)I=0;J=r.D-r.F}
      else{const prev=rows[k-1],rate=J>=0?tasaCliente:tasaCia;
        H=rate*(12*days360(prev.fecha,r.fecha)/360)*J;
        const IH=I+H;let nI,nJ;
        if(IH<0){nI=(IH+r.D)>=0?0:IH+r.D;nJ=(IH+r.D)>=0?J+(IH+r.D)-r.F:J-r.F}
        else{nI=IH<r.F?0:IH-r.F;nJ=J+r.D-(IH<r.F?r.F-IH:0)}
        I=nI;J=nJ}
      totalH+=H});
    return{ajuste:totalH}}
  function vpn(pactado,pagos,tasa){
    const all=[...pactado,...pagos].map(p=>p.fecha).sort();const t0=all[0],tN=all[all.length-1];
    const m=f=>daysActual(t0,f)/(365/12);
    const pv=fl=>fl.reduce((s,p)=>s+p.valor/Math.pow(1+tasa,m(p.fecha)),0);
    return{ajuste:(pv(pactado)-pv(pagos))*Math.pow(1+tasa,m(tN))}}
  function evaluar({pactado,recaudo,propuesta,cfg,valorVenta}){
    const pagos=[...recaudo,...propuesta];let ajuste;
    if(cfg.metodo==='liquidacion')ajuste=liquidacion(pactado,pagos,cfg.tasaCia,cfg.tasaCliente).ajuste;
    else ajuste=vpn(pactado,pagos,cfg.tasaVpn).ajuste;
    ajuste=Math.round(ajuste);
    const tope=Math.round(valorVenta*cfg.topePct);
    const topado=ajuste<0&&-ajuste>tope;
    const aplicado=topado?-tope:ajuste;
    return{ajuste:aplicado,topado,tope,requiereAprobacion:aplicado<0&&-aplicado>valorVenta*cfg.umbralPct}}
  return{days360,evaluar}
})();
</script>

<script>
/* ═══════════ UTILIDADES ═══════════ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>Math.round(Math.abs(v)).toLocaleString('es-CO');
const fmt=v=>(v<0?'−$ ':'$ ')+num(v);
const fmtM=v=>'$ '+(v/1e6).toLocaleString('es-CO',{maximumFractionDigits:1})+' M';
const iso=d=>d.toISOString().slice(0,10);
const dmy=s=>s.split('-').reverse().join('/');
const fLarga=s=>new Date(s+'T12:00:00').toLocaleDateString('es-CO',{day:'numeric',month:'long',year:'numeric'});
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const mesCorto=s=>{const [y,m]=s.split('-');return`${MESES[Number(m)-1]} ${y}`};
const parseNum=s=>{const n=Number(String(s).replace(/\./g,'').replace(/[^\d,-]/g,'').replace(',','.'));return isFinite(n)?n:0};
const now=new Date();
const CORTE=iso(new Date(Date.UTC(now.getFullYear(),now.getMonth(),now.getDate())));
function addM(k,day){const d=new Date(CORTE+'T00:00:00Z');const t=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+k,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(day,last));return iso(t)}
const fechaValida=f=>f&&f>'1900-01-01'?f:null;
let uid=1;const nid=()=>'r'+(uid++);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2600)}

/* ═══════════ DATOS DE DEMOSTRACIÓN ═══════════ */
const CFG={metodo:'liquidacion',tasaCia:0.006,tasaCliente:0.01,tasaVpn:0.008,topePct:0.03,umbralPct:0.015,cuotaMin:1000000,conceptoAbono:'Abono extraordinario'};
const cuotas=(n,desde,dia,valor,concepto='Cuota inicial',extra=()=>({}))=>Array.from({length:n},(_,i)=>({fecha_pp:addM(desde+i,dia),concepto,valor,...extra(i)}));
const NEGOCIOS=[
  {id_venta:1974,inmueble:'T1 - 602',cliente_negocio:'Negocio de demostración (mora)',valor_venta:487500000,valor_credito:341250000,fecha_escrituracion_programada:'1900-01-01',
    plan_pagos:cuotas(15,-9,28,9750000,'Recursos Propios',i=>({int_mora:i<9?180000:0,int_aplicado:i<5?1:(i===5?0:(i===6?60000:0))})),
    recaudo:[...Array.from({length:5},(_,i)=>({fecha:addM(-9+i,28),concepto:'Recursos Propios',valor:10000000})),{fecha:addM(-4,28),concepto:'Recursos Propios',valor:10400000}]},
  {id_venta:2502,inmueble:'T2 - AP-504',cliente_negocio:'Negocio de demostración (al día)',valor_venta:412000000,valor_credito:294000000,fecha_escrituracion_programada:addM(13,20),
    plan_pagos:[{fecha_pp:addM(-12,5),concepto:'Separacion',valor:10000000},...cuotas(24,-11,5,4500000)],
    recaudo:[{fecha:addM(-12,5),concepto:'Separacion',valor:10000000},...cuotas(8,-11,6,4500000,'Recursos Propios').map(c=>({fecha:c.fecha_pp,concepto:c.concepto,valor:c.valor}))]}
];
const negId=Number(new URLSearchParams(location.search).get('n'))||1974;
const N=NEGOCIOS.find(n=>n.id_venta===negId)||NEGOCIOS[0];
N.comprador={nombre:'Comprador de demostración',documento:'1.000.000.000',correo:'comprador@ejemplo.co'};

/* ═══════════ ANÁLISIS (misma lógica del prototipo) ═══════════ */
function analizar(n){
  const pactado=n.plan_pagos.map(p=>({fecha:p.fecha_pp,valor:p.valor,concepto:p.concepto}));
  const recaudo=n.recaudo.map(r=>({fecha:r.fecha,valor:r.valor,concepto:r.concepto}));
  let disp=recaudo.reduce((s,r)=>s+r.valor,0);const pend=[];
  for(const p of[...pactado].sort((a,b)=>a.fecha.localeCompare(b.fecha))){
    const usado=Math.min(disp,p.valor);disp-=usado;const resto=p.valor-usado;
    if(resto>0.5)pend.push({...p,valor:resto,vencida:p.fecha<CORTE})}
  const totPact=pactado.reduce((s,p)=>s+p.valor,0),totRec=recaudo.reduce((s,r)=>s+r.valor,0);
  const vencido=pend.filter(p=>p.vencida).reduce((s,p)=>s+p.valor,0);
  const fechaLimite=fechaValida(n.fecha_escrituracion_programada)||pactado.map(p=>p.fecha).sort().pop();
  const credito=n.valor_credito||0,fechaCredito=fechaValida(n.fecha_credito)||fechaLimite;
  const base=[...pend.map(p=>({fecha:p.vencida?CORTE:p.fecha,valor:p.valor})),...(credito>0?[{fecha:fechaCredito,valor:credito}]:[])];
  const mora=n.plan_pagos.reduce((s,p)=>{const m=p.int_mora||0,a=p.int_aplicado||0;if(a===1)return s;return s+Math.max(0,m-a)},0);
  return{pend,base,credito,fechaCredito,totRec,saldo:totPact-totRec,vencido,mora:Math.round(mora),fechaLimite,recaudo}
}
function initPropuesta(a){
  const vencidas=a.pend.filter(p=>p.vencida),futuras=a.pend.filter(p=>!p.vencida);
  const totalVencido=vencidas.reduce((s,p)=>s+p.valor,0);
  if(totalVencido===0)return futuras.map(p=>({id:nid(),fecha:p.fecha,concepto:p.concepto,valor:p.valor,orig:p.valor,origFecha:p.fecha,fijo:false}));
  if(futuras.length===0)return[{id:nid(),fecha:CORTE,concepto:vencidas[0].concepto,valor:totalVencido,orig:totalVencido,origFecha:CORTE,fijo:true}];
  return futuras.map((p,i)=>({id:nid(),fecha:p.fecha,concepto:p.concepto,valor:i===0?p.valor+totalVencido:p.valor,orig:p.valor,origFecha:p.fecha,fijo:i===0}));
}
function rebalancear(s,a){
  const libres=s.propuesta.filter(p=>!p.fijo).sort((x,y)=>x.fecha.localeCompare(y.fecha));
  if(!libres.length)return;
  const totFijos=s.propuesta.filter(p=>p.fijo).reduce((t,p)=>t+p.valor,0);
  const saldo=Math.max(0,a.saldo-totFijos),base=Math.floor(saldo/libres.length);
  for(let i=0;i<libres.length-1;i++)libres[i].valor=base;
  libres[libres.length-1].valor=Math.round(saldo-base*(libres.length-1));
}
function calc(s,a){
  const propuesta=s.propuesta.map(p=>({fecha:p.fecha,valor:p.valor}));
  const totProp=propuesta.reduce((t,p)=>t+p.valor,0);
  const dif=Math.round(a.saldo-totProp),excedente=Math.max(0,-dif);
  const nuevoCred=Math.max(0,N.valor_credito-excedente);
  const propMotor=[...propuesta,...(a.credito>0?[{fecha:a.fechaCredito,valor:nuevoCred}]:[])];
  const ev=Engine.evaluar({pactado:a.base,recaudo:[],propuesta:propMotor,cfg:CFG,valorVenta:N.valor_venta});
  const errores=[];
  if(dif>1)errores.push(`Faltan ${fmt(dif)} por asignar a las cuotas.`);
  if(s.propuesta.some(p=>p.fecha<CORTE))errores.push('Hay cuotas con fecha anterior a hoy.');
  if(s.propuesta.some(p=>p.fecha>a.fechaLimite))errores.push(`Todas las cuotas deben quedar antes del ${fLarga(a.fechaLimite)}.`);
  if(s.propuesta.some(p=>!p.abono&&p.valor>0&&p.valor<CFG.cuotaMin))errores.push(`Cada cuota debe ser de al menos ${fmt(CFG.cuotaMin)}, salvo los abonos.`);
  if(s.propuesta.some(p=>!(p.valor>0)))errores.push('Hay cuotas en cero. Elimínalas o asígnales un valor.');
  return{totProp,dif,excedente,nuevoCred,ev,errores}
}

/* ═══════════ LÍNEA DE PAGOS ═══════════ */
function lineaSVG(a,s){
  const buckets=new Map();
  const get=k=>{if(!buckets.has(k))buckets.set(k,{pag:0,act:0,pro:0,venc:false});return buckets.get(k)};
  a.recaudo.forEach(r=>get(r.fecha.slice(0,7)).pag+=r.valor);
  a.pend.forEach(p=>{const b=get(p.fecha.slice(0,7));b.act+=p.valor;if(p.vencida)b.venc=true});
  s.propuesta.forEach(p=>get(p.fecha.slice(0,7)).pro+=p.valor);
  get(CORTE.slice(0,7));
  const keys=[...buckets.keys()].sort();
  // llena meses vacíos para que el eje sea proporcional al tiempo
  const full=[];let [y,m]=keys[0].split('-').map(Number);const [yE,mE]=keys[keys.length-1].split('-').map(Number);
  while(y<yE||(y===yE&&m<=mE)){full.push(`${y}-${String(m).padStart(2,'0')}`);m++;if(m>12){m=1;y++}}
  const cred=a.credito>0;
  const W=360,H=190,base=152,top=16,padX=4,alto=base-top;
  const slots=full.length+(cred?2:0);
  const step=(W-2*padX)/slots,bw=Math.max(3,Math.min(18,step*.68));
  const topes=[...buckets.values()].flatMap(b=>[b.act,b.pro]);
  const max=Math.max(...topes,1);
  const hh=v=>Math.min(alto,v/max*alto);
  const cx=i=>padX+step*i+step/2;
  let g='';
  full.forEach((k,i)=>{const b=buckets.get(k);if(!b)return;const x=cx(i)-bw/2;
    if(b.pag>0){const h=hh(b.pag);g+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="1.5" fill="var(--pagado)"/>`}
    if(b.pro>0){const h=hh(b.pro);g+=`<rect x="${x}" y="${base-h}" width="${bw}" height="${h}" rx="1.5" fill="var(--propuesta)"/>`}
    if(b.act>0){const h=hh(b.act);g+=`<rect x="${x-1.5}" y="${base-h-1.5}" width="${bw+3}" height="${h+1.5}" rx="2" fill="none" stroke="${b.venc?'var(--sobre)':'var(--tinta)'}" stroke-width="2" stroke-dasharray="4 3"/>`}
  });
  // crédito: columna aparte al final, recortada a la altura del gráfico (marca de corte)
  let xCred=0;
  if(cred){const w=bw*1.7;xCred=cx(slots-1);const x=xCred-w/2;
    g+=`<rect x="${x}" y="${top}" width="${w}" height="${alto}" rx="2" fill="var(--credito)"/>
        <path d="M${x-1} ${top+alto*.55}l${w+2} -7M${x-1} ${top+alto*.55+7}l${w+2} -7" stroke="var(--papel)" stroke-width="3"/>`}
  const iHoy=full.indexOf(CORTE.slice(0,7)),dia=Number(CORTE.slice(8,10));
  const xHoy=padX+step*(iHoy+Math.min(dia,30)/30);
  const anclaHoy=xHoy>W-34?'end':xHoy<34?'start':'middle';
  const finCuotas=padX+step*full.length;
  const marcas=[0,full.length-1].filter((v,i,ar)=>ar.indexOf(v)===i);
  const eje=marcas.map((i,j)=>`<text x="${j===0?padX:finCuotas}" y="${base+22}" font-size="13" fill="#52646C" text-anchor="${j===0?'start':'end'}">${mesCorto(full[i])}</text>`).join('')
    +(cred?`<text x="${W-padX}" y="${top-6}" font-size="13" font-weight="600" fill="var(--credito)" text-anchor="end">Crédito</text>`:'');
  const resumen=`Línea de pagos de ${mesCorto(full[0])} a ${mesCorto(full[full.length-1])}. Barras grises: pagado. Contorno punteado: plan actual. Barras azules: tu propuesta.${cred?' La barra final es el crédito hipotecario.':''}`;
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(resumen)}">
    <line x1="${padX}" x2="${W-padX}" y1="${base}" y2="${base}" stroke="var(--linea)" stroke-width="1.5"/>
    ${g}
    <line x1="${xHoy}" x2="${xHoy}" y1="${top-4}" y2="${base+4}" stroke="var(--tinta)" stroke-width="1.5"/>
    <text x="${xHoy}" y="${top-6}" font-size="13" font-weight="600" fill="var(--tinta)" text-anchor="${anclaHoy}">Hoy</text>
    ${eje}</svg>`
}

async function sha256(txt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of txt)h=(h*31+ch.charCodeAt(0))|0;return'sin-sha256-'+(h>>>0).toString(16)}}
async function firmar(){
  const f=S.f;
  if(f.code!==f.otp){f.error='El código no coincide. Revísalo e inténtalo de nuevo.';render();const el=$('#otp');if(el)el.focus();return}
  const c=calc(S,A),P=N.comprador;
  const doc={venta:N.id_venta,inmueble:N.inmueble,firmante:P.nombre,documento:P.documento,correo:P.correo,
    propuesta:orden().map(p=>[p.fecha,p.concepto,Math.round(p.valor)]),credito:c.nuevoCred,ajuste:c.ev.ajuste,metodo:CFG.metodo,fecha:new Date().toISOString()};
  const hash=await sha256(JSON.stringify(doc));
  S.firma={...doc,hash,requiereAprobacion:c.ev.requiereAprobacion};
  ir('listo');
}

function renderListo(){
  const c=calc(S,A),F=S.firma,{aj,tipo}=tipoDe(c);
  const cuando=new Date(F.fecha).toLocaleString('es-CO',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'});
  const sigue=[F.requiereAprobacion?'Gerencia revisa y aprueba tu propuesta.':null,'Tu asesor carga el nuevo plan en IngeMAX.','Verificamos que el plan cargado coincida con lo que firmaste.'].filter(Boolean);
  $('.barra').hidden=true;
  $('#app').innerHTML=`<div class="solo">
    <section class="card ok" aria-label="Firma completada">
      <span class="sello-ok" aria-hidden="true"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
      <h1 class="titulo">Propuesta firmada</h1>
      <p>${esc(cuando)}</p>
      <p class="res-ok" data-t="${tipo}">${tipo==='ahorro'?'Ahorras':tipo==='sobre'?'Pagas de más':'Sin cambio en el valor'}${tipo==='neutro'?'':' <strong>'+fmt(Math.abs(aj))+'</strong>'}</p>
    </section>
    <section class="card"><h2>Qué sigue</h2><ol class="sigue">${sigue.map(t=>`<li>${t}</li>`).join('')}</ol></section>
    <section class="card"><h2>Comprobante</h2>
      <dl class="datos"><div><dt>Firmante</dt><dd>${esc(F.firmante)}</dd></div><div><dt>Inmueble</dt><dd>${esc(F.inmueble)}</dd></div>
        <div><dt>Código de verificación</dt><dd class="hash">${F.hash.slice(0,16)}…</dd></div></dl>
      <p class="acc"><button class="btn sec" data-act="imprimir" type="button">Guardar como PDF</button><button class="txt-btn" data-act="hash" type="button">Copiar código completo</button></p>
    </section></div>`;
}

/* ═══════════ EVENTOS DE PASOS ═══════════ */
$('#app').addEventListener('click',async e=>{
  const act=e.target.dataset.act;if(!act)return;
  if(act==='editar')ir('simular');
  if(act==='revisar')ir('revisar');
  if(act==='paso1'){S.f.paso=1;render()}
  if(act==='reenviar'){S.f.otp=String(Math.floor(100000+Math.random()*900000));S.f.code='';S.f.error='';render();toast('Enviamos un código nuevo.')}
  if(act==='imprimir')window.print();
  if(act==='hash'){try{await navigator.clipboard.writeText(S.firma.hash);toast('Código copiado.')}catch(err){toast('No se pudo copiar. Selecciónalo y cópialo a mano.')}}
});
$('#app').addEventListener('change',e=>{if(e.target.id==='acepto'){S.f.acepto=e.target.checked;$('#btnFirmar').disabled=!S.f.acepto}});
$('#app').addEventListener('input',e=>{if(e.target.id==='otp'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,6);S.f.code=e.target.value;$('#btnFirmar').disabled=S.f.code.length!==6}});
$('#btnFirmar').addEventListener('click',()=>S.onBar&&S.onBar());
render();
</script>
</body>
</html>
