<!doctype html>
<html lang="es-CO">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitudes · Viviendas y Proyectos</title>
<link rel="icon" type="image/svg+xml" href="/app/img/icono-vyp.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Onest:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --fondo:#EBF0F2;--papel:#FFFFFF;--tinta:#17262E;--pizarra:#174250;--gris:#898E91;--gris-suave:#C9D1D5;--linea:#D5DDE1;
  --pagado:#A7B4BA;--propuesta:#3E87AA;--credito:#6F8794;
  --ahorro:#2F7D32;--ahorro-fondo:#E4F1E3;--sobre:#8E2450;--sobre-fondo:#F6E4EC;--ambar:#8A5A00;--ambar-fondo:#FBF0D5;
  --radio-g:18px;--radio-m:10px;--radio-p:6px;
  --f-texto:'Onest',system-ui,sans-serif;--f-marca:'Barlow Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fondo);color:var(--tinta);font:400 15px/1.5 var(--f-texto);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pizarra);outline-offset:2px;border-radius:var(--radio-p)}
a{color:var(--pizarra)}
h1,h2,h3{margin:0}
h1{font:700 32px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}
h2{font:700 22px/1.1 var(--f-marca);color:var(--pizarra);letter-spacing:.01em}

/* barra superior */
.top{background:var(--papel);border-bottom:1px solid var(--linea)}
.top .in{max-width:1180px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:32px}
.logo{height:42px;display:block}
.nav{display:flex;gap:4px}
.nav a{padding:8px 14px;border-radius:var(--radio-m);text-decoration:none;font-weight:500;color:#41545D}
.nav a[aria-current=page]{background:var(--fondo);color:var(--pizarra)}
.top .user{margin-left:auto;font-size:14px;color:#52646C}
.demo{background:var(--ambar-fondo);color:var(--ambar);font-size:13px;text-align:center;padding:6px 12px}

main{max-width:1180px;margin:0 auto;padding:28px 24px 64px;display:grid;gap:20px}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.cab p{margin:6px 0 0;color:#41545D}
.btn{min-height:44px;padding:0 20px;border-radius:var(--radio-m);border:0;background:var(--pizarra);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:#0F3340}
.btn:disabled{background:var(--gris-suave);color:#5B6B72;cursor:not-allowed}
.btn.sec{background:var(--papel);color:var(--pizarra);border:2px solid var(--pizarra)}
.btn.sec:hover:not(:disabled){background:var(--fondo)}
.txt-btn{background:none;border:0;padding:6px 4px;color:var(--pizarra);font-weight:500;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.card{background:var(--papel);border-radius:var(--radio-g);padding:22px}

/* bandeja */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:2px solid var(--linea)}
.tabs button{background:none;border:0;padding:10px 14px;margin-bottom:-2px;border-bottom:3px solid transparent;color:#41545D;font-weight:500;cursor:pointer}
.tabs button[aria-selected=true]{color:var(--pizarra);border-bottom-color:var(--pizarra);font-weight:600}
.tabs .n{color:#52646C;font-weight:400;margin-left:4px}
.buscar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.buscar input{width:min(420px,100%);min-height:44px;padding:8px 14px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:var(--papel)}
.tabla{width:100%;border-collapse:collapse;background:var(--papel);border-radius:var(--radio-g);overflow:hidden}
.tabla th{text-align:left;font-size:13px;font-weight:500;color:#52646C;padding:14px 16px;border-bottom:2px solid var(--pizarra)}
.tabla td{padding:14px 16px;border-bottom:1px solid var(--linea);vertical-align:middle}
.tabla tbody tr{cursor:pointer}
.tabla tbody tr:hover{background:#F4F8F9}
.tabla tbody tr:last-child td{border-bottom:0}
.der,.tabla th.der,.carga th.der{text-align:right}
.sub{display:block;font-size:13px;color:#52646C}
.t-link{font-weight:600;color:var(--tinta);text-decoration:none}
.t-link:hover{text-decoration:underline}
.ahorro{color:var(--ahorro);font-weight:600}
.sobre{color:var(--sobre);font-weight:600}
.estado{display:flex;align-items:center;gap:8px}
.punto{width:10px;height:10px;border-radius:50%;flex:none;background:var(--gris)}
.punto.enviada{background:var(--propuesta)}.punto.devuelta{background:var(--sobre)}.punto.borrador{background:var(--gris)}.punto.por_aprobar{background:#C58A12}.punto.por_cargar{background:var(--pizarra);box-shadow:0 0 0 3px #17425033}
.punto.cargada{background:#C58A12}.punto.verificada{background:var(--ahorro)}.punto.vencida{background:var(--sobre)}
.punto.por_enviar{background:var(--ahorro);box-shadow:0 0 0 3px #2F7D3233}.punto.rechazada_comprador{background:var(--sobre)}
.vacio{padding:40px 16px;text-align:center;color:#52646C}

/* detalle */
.migas{font-size:14px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.pila{display:grid;gap:20px}
.fila-res{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.fila-res .cifra{font-size:40px;font-weight:300;letter-spacing:-.02em;line-height:1.1}
.fila-res.ahorro .cifra,.fila-res .cifra.ahorro{color:var(--ahorro)}
.fila-res .cifra.sobre{color:var(--sobre)}
.linea svg{width:100%;height:auto;max-height:230px;display:block;overflow:visible}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 16px;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:#41545D}
.leyenda li{display:flex;align-items:center;gap:6px}
.sw{width:14px;height:10px;border-radius:2px;display:inline-block}
.sw.pag{background:var(--pagado)}.sw.act{border:2px dashed var(--tinta)}.sw.pro{background:var(--propuesta)}.sw.cre{background:var(--credito)}
.comp{font-size:14.5px}
.comp th{font-weight:500}
.comp .lado{border-left:1px solid var(--linea)}
.comp .venc{color:var(--sobre);font-weight:500}
.comp tfoot td{font-weight:600}
.comp thead tr:first-child th{font:700 18px/1.2 var(--f-marca);color:var(--pizarra);border-bottom:0;padding-bottom:6px}
.aviso{border-radius:var(--radio-m);padding:12px 14px;font-size:14px}
.aviso p{margin:0}.aviso p+p{margin-top:4px}
.aviso.mora{background:var(--sobre-fondo);color:#5A1735}
.aviso.cred{background:var(--ambar-fondo);color:var(--ambar)}
.aviso.ok{background:var(--ahorro-fondo);color:#1D5A20}
.aviso.err{background:var(--papel);border:1.5px solid var(--sobre);color:#5A1735}
.chip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 10px;border-radius:999px;background:var(--papel);font-weight:500;font-size:14px}
.accion h2{margin-bottom:10px}
.accion p{margin:0 0 12px}
.accion .btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.link-box{display:flex;gap:8px}
.link-box input{flex:1;min-width:0;min-height:44px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:#F8FAFB;font-size:14px}
.prueba{margin-top:14px;padding-top:12px;border-top:1px dashed var(--gris-suave);font-size:13px;color:#52646C}
.carga{width:100%;border-collapse:collapse;font-size:14px;margin-top:4px}
.carga th{text-align:left;font-size:12.5px;font-weight:500;color:#52646C;padding:6px 6px;border-bottom:2px solid var(--pizarra)}
.carga td{padding:8px 6px;border-bottom:1px solid var(--linea);vertical-align:middle}
.carga .cp{padding:2px 6px;min-height:0;font-size:13px}
.carga tr.ajuste td{background:#F4F8F9}
.verif li{list-style:none;display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--linea);font-size:14px}
.verif{margin:10px 0 0;padding:0}
.verif .si{color:var(--ahorro);font-weight:700}.verif .no{color:var(--sobre);font-weight:700}
.tiempo{margin:10px 0 0;padding:0;list-style:none}
.tiempo li{position:relative;padding:0 0 16px 26px;font-size:14.5px;color:#52646C}
.tiempo li::before{content:"";position:absolute;left:5px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--gris-suave);background:var(--papel)}
.tiempo li::after{content:"";position:absolute;left:10px;top:19px;bottom:-5px;width:2px;background:var(--linea)}
.tiempo li:last-child::after{display:none}
.tiempo li.hecho{color:var(--tinta)}
.tiempo li.hecho::before{background:var(--pizarra);border-color:var(--pizarra)}
.tiempo li.actual{color:var(--tinta);font-weight:600}
.tiempo li.actual::before{border-color:var(--pizarra);border-width:3px}
.tiempo small{display:block;font-weight:400;color:#52646C}
.datos{margin:8px 0 0;display:grid}
.datos div{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--linea)}
.datos div:first-child{border-top:0}
.datos dt{color:#52646C;font-size:14px}.datos dd{margin:0;font-weight:500;text-align:right;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}
/* plan editable */
.plan-inp{width:100%;min-height:34px;padding:3px 8px;border:1.5px solid var(--linea);border-radius:var(--radio-p);background:var(--papel);font-size:14px;font-variant-numeric:tabular-nums}
.plan-inp.der{text-align:right}
.plan-inp:focus{border-color:var(--pizarra);outline:none}
/* nueva solicitud */
.form{display:grid;gap:16px;max-width:640px}
.campo{display:grid;gap:4px}
.campo label{font-size:13.5px;color:#41545D;font-weight:500}
.campo input,.campo select{min-height:46px;padding:8px 12px;border:1.5px solid var(--linea);border-radius:var(--radio-m);background:var(--papel)}
.res-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.res-list button{width:100%;text-align:left;background:var(--papel);border:1.5px solid var(--linea);border-radius:var(--radio-m);padding:12px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:12px}
.res-list button:hover:not(:disabled){border-color:var(--pizarra);background:#F4F8F9}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(23,38,46,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}
.overlay[hidden]{display:none}
.modal{background:var(--papel);border-radius:var(--radio-g);padding:28px 24px;width:100%;max-width:440px;display:grid;gap:16px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.modal-cab{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.modal-cab h2{margin:0}
.modal-x{background:none;border:0;font-size:22px;line-height:1;color:var(--gris);cursor:pointer;padding:2px 6px;border-radius:var(--radio-p)}
.modal-x:hover{color:var(--tinta)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:10px 18px;border-radius:var(--radio-m);font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:1000px){.cols{grid-template-columns:1fr}.top .in{gap:16px;padding:10px 16px}main{padding:20px 16px 48px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="in" id="cab"></div></header>
<main id="app"><p class="vacio">Cargando…</p></main>
<div class="toast" id="toast" role="status"></div>
<div class="overlay" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
  <div class="modal" id="modal-inner"></div>
</div>

<script src="/app/motor.js"></script>
<script src="/app/api.js"></script>
<script>
/* ═══════════ ESTADO ═══════════ */
const UI = {
  filtro: 'todas', q: '', lista: [], proyectos: [],
  nueva: { proyecto: null, q: '', sel: null, correo: '', res: [], estado: 'ocioso', error: '' },
  verif: {},
  PL: { items: [], resultado: null, evalReq: 0 },
  ocupado: false,
};
let USUARIO = null;

const ESTADOS = {
  borrador: 'Borrador',
  por_aprobar: 'Por aprobar',
  por_enviar: 'Por enviar al comprador',
  enviada: 'Enviada al comprador',
  por_cargar: 'Por cargar en IngeMAX',
  cargada: 'Cargada, por verificar',
  verificada: 'Verificada',
  devuelta: 'Devuelta por gerencia',
  rechazada_comprador: 'Rechazada por comprador',
  vencida: 'Link vencido',
};
const FILTROS = [
  ['todas', 'Todas'], ['borrador', 'Borrador'], ['por_aprobar', 'Por aprobar'],
  ['por_enviar', 'Por enviar'], ['enviada', 'Enviadas'], ['por_cargar', 'Por cargar'],
  ['cargada', 'Por verificar'], ['verificada', 'Verificadas'],
  ['devuelta', 'Devueltas'], ['rechazada_comprador', 'Rechazadas'], ['vencida', 'Vencidas'],
];
const SIEMPRE = new Set(['todas', 'borrador', 'por_aprobar', 'por_enviar', 'enviada', 'por_cargar', 'cargada', 'verificada']);

const dia = iso => (iso || '').slice(0, 10);
const diasPara = iso => Math.round((Date.parse(dia(iso) + 'T12:00:00Z') - Date.parse(CORTE + 'T12:00:00Z')) / 86400000);
const resTxt = aj => aj <= -1 ? `<span class="ahorro">Ahorra ${fmt(-aj)}</span>` : aj >= 1 ? `<span class="sobre">Paga ${fmt(aj)} de más</span>` : 'Sin cambio';
function detalleEstado(s) {
  if (s.estado_ui === 'enviada' && s.vence_en) { const d = diasPara(s.vence_en); return d <= 0 ? 'Vence hoy' : `Vence en ${d} día${d === 1 ? '' : 's'}`; }
  if (s.estado_ui === 'borrador') return 'Sin enviar';
  if (s.estado_ui === 'por_aprobar') return 'Gerencia';
  if (s.estado_ui === 'por_enviar') return 'Aprobada';
  if (s.estado_ui === 'devuelta') return 'Revisa el comentario';
  if (s.estado_ui === 'rechazada_comprador') return 'Comprador rechazó';
  return '';
}
const adaptar = an => ({ recaudo: an.recaudo, pend: an.pendiente, credito: an.credito, fechaCredito: an.fecha_credito });
const correoValido = c => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c);

function mostrarError(e) {
  if (e.status === 401) { location.replace('/app/login.html?next=' + encodeURIComponent(location.pathname + location.hash)); return; }
  $('#app').innerHTML = `<div class="card vacio"><p>${esc(e.message)}</p><a href="#/">Volver a solicitudes</a></div>`;
}

/* ═══════════ BANDEJA ═══════════ */
async function vistaBandeja() {
  UI.lista = await API.get('/solicitudes');
  const cuenta = f => f === 'todas' ? UI.lista.length : UI.lista.filter(s => s.estado_ui === f).length;
  const porCargar = cuenta('por_cargar'), porVer = cuenta('cargada'), dev = cuenta('devuelta'), porEnv = cuenta('por_enviar');
  const partes = [
    porEnv && `${porEnv} por enviar al comprador`,
    porCargar && `${porCargar} por cargar en IngeMAX`,
    porVer && `${porVer} por verificar`,
    dev && `${dev} devuelta${dev === 1 ? '' : 's'} por gerencia`,
  ].filter(Boolean);
  const frase = partes.length ? 'Tienes ' + partes.join(', ').replace(/, ([^,]*)$/, ' y $1') + '.' : 'No tienes tareas pendientes.';
  const q = UI.q.trim().toLowerCase();
  const lista = UI.lista.filter(s => (UI.filtro === 'todas' || s.estado_ui === UI.filtro) &&
    (!q || [s.inmueble, s.comprador.nombre, s.comprador.documento, s.proyecto.nombre, String(s.id_venta)].join(' ').toLowerCase().includes(q)));
  const filas = lista.map(s => `<tr data-id="${s.id}" tabindex="0">
    <td><a class="t-link" href="#/s/${s.id}">${esc(s.inmueble || 'Venta ' + s.id_venta)}</a><span class="sub">${esc(s.proyecto.nombre)}</span></td>
    <td>${esc(s.comprador.nombre)}<span class="sub">${esc(s.comprador.documento)}</span></td>
    <td class="der">${resTxt(s.ajuste)}</td>
    <td><span class="estado"><span class="punto ${s.estado_ui}"></span><span>${ESTADOS[s.estado_ui] || s.estado_ui}<span class="sub">${esc(detalleEstado(s))}</span></span></span></td>
    <td class="der"><span class="sub">Venta ${s.id_venta}</span></td></tr>`).join('');
  $('#app').innerHTML = `
  <div class="cab"><div><h1>Solicitudes</h1><p>${frase}</p></div><button class="btn" data-act="nueva" type="button">Nueva solicitud</button></div>
  <div class="tabs" role="tablist" aria-label="Filtrar por estado">${FILTROS.filter(([k]) => SIEMPRE.has(k) || cuenta(k) > 0).map(([k, t]) =>
    `<button role="tab" aria-selected="${UI.filtro === k}" data-f="${k}" type="button">${t}<span class="n">${cuenta(k)}</span></button>`).join('')}</div>
  <div class="buscar"><label class="sr" for="q">Buscar</label><input id="q" type="search" placeholder="Buscar por inmueble, comprador o documento" value="${esc(UI.q)}"></div>
  ${lista.length ? `<table class="tabla"><thead><tr><th scope="col">Inmueble</th><th scope="col">Comprador</th><th scope="col" class="der">Resultado de la propuesta</th><th scope="col">Estado</th><th scope="col"><span class="sr">Venta</span></th></tr></thead><tbody>${filas}</tbody></table>`
    : `<div class="card vacio"><p>${UI.lista.length ? 'No hay solicitudes con ese filtro.' : 'Todavía no hay solicitudes. Crea la primera con «Nueva solicitud».'}</p>${UI.lista.length ? '<button class="txt-btn" data-act="limpiar" type="button">Ver todas</button>' : ''}</div>`}`;
  if (UI.enfocarQ) { const q2 = $('#q'); q2.focus(); q2.setSelectionRange(q2.value.length, q2.value.length); UI.enfocarQ = false; }
}

/* ═══════════ NUEVA SOLICITUD ═══════════ */
async function vistaNueva() {
  if (!UI.proyectos.length) UI.proyectos = await API.get('/proyectos');
  const N = UI.nueva;
  if (N.proyecto == null && UI.proyectos.length) N.proyecto = UI.proyectos[0].id;
  pintarNueva();
  if (N.estado === 'ocioso') buscarNegocios();
}
function pintarNueva() {
  const N = UI.nueva;
  const lista = N.estado === 'cargando' ? '<p class="sub">Consultando IngeMAX…</p>' : N.error ? `<div class="aviso err" role="alert"><p>${esc(N.error)}</p></div>`
    : N.res.length ? `<ul class="res-list">${N.res.map(n => `<li><button type="button" data-sel="${n.id_venta}" ${n.abierta ? 'disabled title="Ya tiene una solicitud abierta"' : ''}>
        <span><b>${esc(n.inmueble || 'Venta ' + n.id_venta)}</b> · ${esc(n.comprador)}<span class="sub">Documento ${esc(n.documento)}</span></span>
        <span class="sub">${n.abierta ? 'Ya tiene solicitud abierta' : 'Venta ' + fmtM(n.valor_venta)}</span></button></li>`).join('')}</ul>`
    : '<p class="sub">No encontramos negocios con esa búsqueda.</p>';
  $('#app').innerHTML = `
  <p class="migas"><a href="#/">← Solicitudes</a></p>
  <div class="cab"><h1>Nueva solicitud</h1></div>
  <div class="form card">
    <div class="campo"><label for="proy">Proyecto</label><select id="proy">${UI.proyectos.map(p => `<option value="${p.id}" ${p.id === N.proyecto ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></div>
    <div class="campo"><label for="nq">Buscar negocio por inmueble, comprador o documento</label><input id="nq" type="search" value="${esc(N.q)}"></div>
    ${lista}
  </div>`;
}

function abrirModal(idVenta) {
  const N = UI.nueva;
  const n = N.res.find(x => x.id_venta === idVenta);
  if (!n) return;
  N.sel = idVenta;
  N.correo = n.correo || '';
  pintarModal();
  document.getElementById('modal').hidden = false;
  setTimeout(() => { const c = document.getElementById('correo-modal'); if (c) c.focus(); }, 50);
}

function pintarModal() {
  const N = UI.nueva;
  const n = N.res.find(x => x.id_venta === N.sel);
  if (!n) return;
  const ayuda = n.correo ? 'Viene de IngeMAX. Cámbialo si no es el correcto.' : 'IngeMAX no trae el correo. Lo necesitamos para enviarle el código de firma.';
  document.getElementById('modal-inner').innerHTML = `
    <div class="modal-cab">
      <h2 id="modal-titulo">${esc(n.inmueble || 'Venta ' + n.id_venta)}</h2>
      <button class="modal-x" data-act="cerrar-modal" type="button" aria-label="Cerrar">×</button>
    </div>

function cerrarModal() {
  document.getElementById('modal').hidden = true;
  UI.nueva.sel = null;
  UI.nueva.correo = '';
}
let temporizadorBusqueda;
async function buscarNegocios() {
  const N = UI.nueva; if (!N.proyecto) return;
  N.estado = 'cargando'; N.error = ''; pintarNueva();
  const pedido = JSON.stringify([N.proyecto, N.q]);
  try {
    const r = await API.get(`/solicitudes/negocios/buscar?proyecto_id=${N.proyecto}&q=${encodeURIComponent(N.q.trim())}`);
    if (pedido !== JSON.stringify([N.proyecto, N.q])) return;
    N.res = r; N.estado = 'listo';
    if (N.sel && !r.find(n => n.id_venta === N.sel)) N.sel = null;
  } catch (e) {
    if (e.status === 401) return mostrarError(e);
    N.res = []; N.estado = 'listo'; N.error = e.message;
  }
  pintarNueva();
  const nq = $('#nq'); if (nq && UI.enfocarNQ) { nq.focus(); nq.setSelectionRange(nq.value.length, nq.value.length); }
}

/* ═══════════ PLAN EDITABLE (borrador) ═══════════ */
function _evalResHTML(res) {
  if (!res) return '';
  if (res.errors && res.errors.length) return `<div class="aviso err"><p>${res.errors.map(esc).join('<br>')}</p></div>`;
  const aj = res.ajuste, tipo = aj <= -1 ? 'ahorro' : aj >= 1 ? 'sobre' : '';
  let html = tipo === 'ahorro'
    ? `<div class="aviso ok"><p>El comprador ahorra <b>${fmt(-aj)}</b>.${res.requiere_aprobacion ? ' Supera el umbral → gerencia debe aprobarlo.' : ''}</p></div>`
    : tipo === 'sobre' ? `<div class="aviso mora"><p>El comprador paga <b>${fmt(aj)} de más</b>.</p></div>`
    : `<div class="aviso ok"><p>Sin cambio en el valor total.</p></div>`;
  if (res.excedente > 0) html += `<div class="aviso cred" style="margin-top:8px"><p>Excedente sobre capital: el crédito bajaría a <b>${fmt(res.nuevo_credito)}</b>. Informar al banco.</p></div>`;
  return html;
}

let _evalTimer;
async function evalPlan() {
  const id = idActual(); if (!id || !UI.PL.items.length) return;
  const req = ++UI.PL.evalReq;
  clearTimeout(_evalTimer);
  _evalTimer = setTimeout(async () => {
    try {
      const res = await API.post(`/solicitudes/${id}/evaluar`, { propuesta: UI.PL.items });
      if (req !== UI.PL.evalReq) return;
      UI.PL.resultado = res;
      const el = document.getElementById('eval-res');
      if (el) { const h = _evalResHTML(res); el.innerHTML = h; el.style.marginTop = h ? '12px' : '0'; }
    } catch (_) { /* fallo silencioso en eval en tiempo real */ }
  }, 500);
}

async function guardarPlan() {
  const id = idActual(); if (!id || UI.ocupado) return;
  UI.ocupado = true;
  try {
    const d = await API.patch(`/solicitudes/${id}/plan`, { propuesta: UI.PL.items });
    toast('Plan guardado.');
    UI.PL.items = JSON.parse(JSON.stringify(d.propuesta));
    UI.PL.resultado = null;
    pintarDetalle(d);
  } catch (e) { if (e.status === 401) return mostrarError(e); toast(e.message); }
  finally { UI.ocupado = false; }
}

async function guardarYEnviar() {
  const id = idActual(); if (!id || UI.ocupado) return;
  UI.ocupado = true;
  try {
    await API.patch(`/solicitudes/${id}/plan`, { propuesta: UI.PL.items });
    const d = await API.post(`/solicitudes/${id}/enviar`);
    toast('Enviada.');
    pintarDetalle(d);
  } catch (e) { if (e.status === 401) return mostrarError(e); toast(e.message); }
  finally { UI.ocupado = false; }
}

const PASOS = [
  ['creada', 'Solicitud creada'],
  ['enviada', 'Link enviado al comprador'],
  ['aprobada', 'Aprobada por gerencia'],
  ['firmada', 'Firmada por el comprador'],

}

function pintarDetalle(d) {
  const a = adaptar(d.analisis), r = d.resultado, aj = d.ajuste, tipo = aj <= -1 ? 'ahorro' : aj >= 1 ? 'sobre' : '';

  const hechos = new Set(d.eventos.map(e => e.t));
  const pasos = PASOS.filter(([k]) => k !== 'aprobada' || hechos.has('aprobada') || d.requiere_aprobacion);
  const sig = pasos.find(([k]) => !hechos.has(k));
  const tiempoHTML = pasos.map(([k, t]) => {
    const e = d.eventos.find(x => x.t === k);
    const cls = hechos.has(k) ? 'hecho' : (sig && sig[0] === k ? 'actual' : '');
    return `<li class="${cls}">${t}${e ? `<small>${fLarga(e.fecha)}</small>` : ''}</li>`;

  (hechos.has('devuelta') ? `<li class="actual">Devuelta por gerencia<small>${fLarga(d.eventos.find(x => x.t === 'devuelta').fecha)}</small></li>` : '');

/* ═══════════ ACCIONES ═══════════ */
async function copiar(txt, msg) { try { await navigator.clipboard.writeText(txt); toast(msg); } catch (e) { toast('No se pudo copiar. Selecciónalo y cópialo a mano.'); } }
const lineaTxt = l => `${l.concepto}\t${dmy(l.fecha)}\t${l.valor}`;
const idActual = () => (location.hash.match(/#\/s\/(.+)/) || [])[1];

async function sobreSolicitud(ruta, mensaje) {
  if (UI.ocupado) return; UI.ocupado = true;
  try { const d = await API.post(`/solicitudes/${idActual()}/${ruta}`); if (mensaje) toast(mensaje); pintarDetalle(d); }
  catch (e) { if (e.status === 401) return mostrarError(e); toast(e.message); }
  finally { UI.ocupado = false; }
}

document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-f],[data-sel],[data-copia],tbody tr[data-id]'); if (!t) return;
  if (t.dataset.f) { UI.filtro = t.dataset.f; return vistaBandeja().catch(mostrarError); }
  if (t.dataset.sel) { return abrirModal(Number(t.dataset.sel)); }
  if (t.dataset.act === 'cerrar-modal') { cerrarModal(); return; }
  if (t.matches('tr[data-id]')) { if (e.target.closest('a')) return; location.hash = '#/s/' + t.dataset.id; return; }
  const d = UI.det;
  if (t.dataset.copia !== undefined && d) return copiar(lineaTxt(d.lineas_carga[Number(t.dataset.copia)]), 'Línea copiada.');
  switch (t.dataset.act) {
    case 'nueva': location.hash = '#/nueva'; break;
    case 'limpiar': UI.filtro = 'todas'; UI.q = ''; vistaBandeja().catch(mostrarError); break;
    case 'crear': {
      const N = UI.nueva; if (UI.ocupado || !N.sel || !correoValido(N.correo)) break; UI.ocupado = true; pintarModal();
      try { const s = await API.post('/solicitudes', { proyecto_id: N.proyecto, id_venta: N.sel, correo: N.correo.trim() });
        cerrarModal();
        UI.nueva = { proyecto: N.proyecto, q: '', sel: null, correo: '', res: [], estado: 'ocioso', error: '' };
        toast('Solicitud creada.'); location.hash = '#/s/' + s.id; }
      catch (x) { if (x.status === 401) return mostrarError(x); toast(x.message); }
      finally { UI.ocupado = false; }
      break; }
    case 'guardar-plan': guardarPlan(); break;
    case 'guardar-enviar': guardarYEnviar(); break;
    case 'eliminar': {
      if (!confirm(`¿Eliminar la solicitud de ${esc(d.comprador.nombre)} (${esc(d.inmueble || 'Venta ' + d.id_venta)})?\nEsta acción no se puede deshacer.`)) break;
      if (UI.ocupado) break; UI.ocupado = true;
      try { await API.delete(`/solicitudes/${d.id}`); toast('Solicitud eliminada.'); location.hash = '#/'; }
      catch (x) { if (x.status === 401) return mostrarError(x); toast(x.message); }
      finally { UI.ocupado = false; }
      break; }
    case 'add-fila': {
      const pl = UI.PL.items;
      const ult = pl[pl.length - 1];
      let fecha = CORTE;
      if (ult) {
        const d2 = new Date(ult.fecha + 'T12:00:00Z');
        d2.setMonth(d2.getMonth() + 1);
        fecha = d2.toISOString().slice(0, 10);
      }
      pl.push({ fecha, valor: 0, concepto: '', abono: false, fijo: false });
      pintarDetalle(UI.det);
      break; }
    case 'del-fila': {
      const pi = Number(t.dataset.pi);
      UI.PL.items.splice(pi, 1);
      evalPlan();
      pintarDetalle(UI.det);
      break; }
    case 'enviar_comprador': sobreSolicitud('enviar_comprador', 'Link enviado al comprador.'); break;
    case 'reabrir': sobreSolicitud('reabrir', 'Solicitud reabierta como borrador.'); break;
    case 'cargado': sobreSolicitud('cargada', 'Marcada como cargada.'); break;
    case 'copiar-link': copiar(location.origin + d.link, 'Link copiado.'); break;
    case 'copiar-todo': copiar(d.lineas_carga.map(lineaTxt).join('\n'), 'Líneas copiadas.'); break;
    case 'verificar': {
      if (UI.ocupado) break; UI.ocupado = true;
      try { const r = await API.post(`/solicitudes/${d.id}/verificar`); UI.verif[d.id] = r.verificacion; if (r.verificacion.ok) toast('Plan verificado.'); pintarDetalle(r.solicitud); }
      catch (x) { if (x.status === 401) return mostrarError(x); toast(x.message); }
      finally { UI.ocupado = false; }
      break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('tbody tr[data-id]')) location.hash = '#/s/' + e.target.dataset.id;
  if (e.key === 'Escape') cerrarModal();
});
document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) cerrarModal(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { UI.q = e.target.value; UI.enfocarQ = true; vistaBandeja().catch(mostrarError); }
  if (e.target.id === 'nq') { UI.nueva.q = e.target.value; UI.nueva.sel = null; UI.enfocarNQ = true; clearTimeout(temporizadorBusqueda); temporizadorBusqueda = setTimeout(buscarNegocios, 400); }
  if (e.target.id === 'correo-modal') { UI.nueva.correo = e.target.value; const b = document.querySelector('#modal-inner [data-act=crear]'); if (b) b.disabled = !correoValido(UI.nueva.correo) || UI.ocupado; }
  if (e.target.dataset.pi !== undefined && e.target.dataset.pk) {
    const pi = Number(e.target.dataset.pi), pk = e.target.dataset.pk;
    UI.PL.items[pi][pk] = pk === 'valor' ? Number(e.target.value) : e.target.value;
    evalPlan();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'proy') { UI.nueva.proyecto = Number(e.target.value); UI.nueva.sel = null; UI.nueva.res = []; buscarNegocios(); } });

/* ═══════════ RUTAS ═══════════ */
async function render() {
  const h = location.hash || '#/';
  try {
    if (h.startsWith('#/s/')) await vistaDetalle(h.slice(4));
    else if (h === '#/nueva') await vistaNueva();
    else await vistaBandeja();
  } catch (e) { mostrarError(e); }
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
(async () => {
  USUARIO = await exigirSesion(['asesor', 'gerente']);
  if (!USUARIO) return;
  pintarCabecera(USUARIO, '/app/asesor.html');
  render();
})().catch(mostrarError);
</script>
</body>
</html>
