<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replantea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --bg:#f0f2f1;--surf:#fff;--surf2:#f5f7f6;--ink:#11201b;--ink2:#4a5650;--muted:#7c8882;--line:#dae1dd;
  --acc:#0e5c54;--acc2:#e6f0ee;--acc-ink:#fff;
  --good:#1a7a3c;--good-bg:#e4f3e9;--bad:#b0312a;--bad-bg:#f7e6e4;--warn:#92600a;--warn-bg:#f7efda;
  --fd:"Bricolage Grotesque",system-ui,sans-serif;
  --fb:"Public Sans",system-ui,sans-serif;
  --fn:"JetBrains Mono",monospace;
  --r:10px;--hdr:54px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d1512;--surf:#141f1c;--surf2:#192421;--ink:#e4ece8;--ink2:#b0bdb8;--muted:#889390;--line:#283330;
  --acc:#5abcb0;--acc2:#1a3230;--acc-ink:#06201d;
  --good:#66cb88;--good-bg:#17311f;--bad:#f0857a;--bad-bg:#381b18;--warn:#e6b255;--warn-bg:#33270f;
  color-scheme:dark}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14px;line-height:1.5}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.01em;text-wrap:balance}
h1{font-size:20px}h2{font-size:16px}h3{font-size:14px;font-weight:700}
.mono,.n{font-family:var(--fn);font-variant-numeric:tabular-nums}
.n{text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:12px}[hidden]{display:none!important}

/* ─── chrome ─── */
header{height:var(--hdr);background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:10}
.brand{font-family:var(--fd);font-size:19px;font-weight:700;color:var(--ink);text-decoration:none;flex:none}
.brand sup{font-size:10px;font-family:var(--fb);font-weight:600;color:var(--muted);margin-left:3px}
nav{display:flex;gap:2px}
nav button{all:unset;cursor:pointer;padding:6px 13px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink2)}
nav button:hover{background:var(--surf2)}
nav button[aria-current]{background:var(--acc2);color:var(--acc)}
.nav-cfg{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;white-space:nowrap}
.nav-cfg:hover{color:var(--ink);border-color:var(--ink2)}
.proto-bar{background:var(--warn-bg);color:var(--warn);font-size:11.5px;padding:5px 20px;text-align:center}
.view{display:none}.view.on{display:block}

/* ─── asesor layout: sidebar + content ─── */
.layout{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:calc(100vh - var(--hdr) - 30px)}
.sidebar{border-right:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:11px;position:sticky;top:var(--hdr);height:calc(100vh - var(--hdr));overflow-y:auto}
.content{padding:16px 20px;display:flex;flex-direction:column;gap:14px}
@media(max-width:768px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
.side-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
select,input[type=text],input[type=search],input[type=date],input[type=email],input[type=number]{
  font:14px var(--fb);color:var(--ink);background:var(--surf);border:1px solid var(--line);border-radius:7px;padding:7px 10px;width:100%;outline:none}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 14%,transparent)}
input.num{font-family:var(--fn);text-align:right}
.neg-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1;overflow-y:auto}
.neg-list button{all:unset;cursor:pointer;padding:9px 11px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 6px;background:var(--surf)}
.neg-list button:last-child{border-bottom:0}
.neg-list button:hover{background:var(--surf2)}
.neg-list button[aria-selected=true]{background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.neg-list .t{font-size:13px;font-weight:700}.neg-list .s{font-size:11px;color:var(--muted);grid-column:1/-1}

/* ─── chips ─── */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.chip::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor;flex:none}
.chip.good{background:var(--good-bg);color:var(--good)}.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.acc{background:var(--acc2);color:var(--acc)}
.chip.neu{background:var(--surf2);color:var(--ink2);border-color:var(--line)}

/* ─── buttons ─── */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surf);color:var(--ink);padding:7px 14px;border-radius:7px;font:600 13px var(--fb);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surf2)}.btn.sm{padding:5px 10px;font-size:12px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.pri:hover{filter:brightness(1.08)}.btn.pri:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.ghost{border-color:transparent;background:transparent;color:var(--acc);padding:5px 8px}
.btn.ghost:hover{background:var(--acc2)}

/* ─── kpis ─── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
@media(max-width:640px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surf);padding:10px 13px}
.kpi .v{font-family:var(--fn);font-size:15px;font-weight:700;overflow-wrap:anywhere}
.kpi .l{font-size:11px;color:var(--muted);margin-top:1px}

/* ─── parallel view ─── */
.par-wrap{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
@media(max-width:860px){.par-wrap{grid-template-columns:1fr}}
.par-col{display:flex;flex-direction:column;min-width:0}
.par-col:last-child{border-left:2px solid var(--acc)}
@media(max-width:860px){.par-col:last-child{border-left:none;border-top:2px solid var(--acc)}}
.par-hd{background:var(--surf2);border-bottom:1px solid var(--line);padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.par-hd-l{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);display:flex;align-items:center;gap:7px}
.par-hd-r{display:flex;gap:4px;align-items:center}
.tbl-scroll{overflow-y:auto;max-height:380px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;background:var(--surf2);position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;background:var(--surf2);font-size:12px}
tr.paid td{color:var(--muted)}
tr.overdue td{background:color-mix(in srgb,var(--bad-bg) 40%,transparent)}
tr.overdue td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
tr.overdue-r td{background:color-mix(in srgb,var(--warn-bg) 40%,transparent)}
tr.overdue-r td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.ed td{padding:5px 6px}
.ed input{padding:5px 8px;font-size:13px;border-radius:5px}
.ed input[type=date]{min-width:126px}.ed input.num{min-width:110px}
.ed select{padding:5px 8px;font-size:13px;border-radius:5px}
.xb{all:unset;cursor:pointer;color:var(--muted);padding:3px 5px;border-radius:4px;font-size:15px;line-height:1}
.xb:hover{background:var(--bad-bg);color:var(--bad)}
.lb{all:unset;cursor:pointer;padding:3px 5px;border-radius:4px;font-size:13px;line-height:1}
.lb:hover{background:var(--acc2)}

/* ─── result banner ─── */
.res-banner{border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surf)}
.res-banner.good{background:var(--good-bg);border-color:transparent}
.res-banner.bad{background:var(--bad-bg);border-color:transparent}
.res-banner .lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--ink2);flex:none}
.res-banner .amt{font-family:var(--fn);font-size:26px;font-weight:700;letter-spacing:-.02em}
.res-banner.good .amt{color:var(--good)}.res-banner.bad .amt{color:var(--bad)}
.res-banner .sub{font-size:12px;color:var(--ink2);margin-left:auto;text-align:right}

/* ─── checks ─── */
.checks{list-style:none;display:flex;flex-direction:column;gap:4px}
.checks li{display:flex;gap:7px;align-items:flex-start;font-size:12.5px}
.checks li.ok{color:var(--ink2)}.checks li.ko{color:var(--bad)}
.checks li b{font-family:var(--fn);width:14px;flex:none;text-align:center}

/* ─── misc ─── */
.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.between{justify-content:space-between}.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:15px}
.note{background:var(--surf2);border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:12.5px;color:var(--ink2)}
.empty{padding:36px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r);font-size:13px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.gap{flex:1}
.linkbox{display:flex;gap:8px;align-items:center;border:1px dashed var(--acc);background:var(--acc2);border-radius:8px;padding:10px 12px;flex-wrap:wrap}
.linkbox code{font-family:var(--fn);font-size:12px;color:var(--acc);overflow-wrap:anywhere;flex:1 1 200px}

/* ─── sign form ─── */
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink2)}
.otp-in{font-family:var(--fn);font-size:24px;letter-spacing:.3em;text-align:center;padding:10px}
.receipt{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surf)}
.hash{font-family:var(--fn);font-size:11px;overflow-wrap:anywhere;color:var(--ink2);background:var(--surf2);padding:7px 9px;border-radius:5px}
.lines div{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:3px 0}
.lines .tot{border-top:1px solid var(--line);padding-top:6px;font-weight:700}
.lines .n{font-family:var(--fn);font-variant-numeric:tabular-nums}

/* ─── approve view ─── */
.sol-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.sol-list button{all:unset;cursor:pointer;padding:10px 12px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 8px;background:var(--surf)}
.sol-list button:last-child{border-bottom:0}
.sol-list button:hover{background:var(--surf2)}
.sol-list button[aria-selected=true]{background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.sol-list .t{font-weight:700;font-size:13px}.sol-list .s{font-size:11px;color:var(--muted);grid-column:1/-1}

/* ─── redistribute popover ─── */
.rd-anchor{position:relative}
.rd-pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:30;min-width:240px;flex-direction:column;gap:10px}
.rd-pop.open{display:flex}

/* ─── toast ─── */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:100}
.toast.on{opacity:1}
input[type=checkbox]{width:16px;height:16px;padding:0;flex:none;accent-color:var(--acc)}
</style>
</head>

<script>
/* ═══════════════ MOTOR DE CÁLCULO ═══════════════ */
const Engine = (() => {
  const parse = s => { const [y,m,d] = s.split('-').map(Number); return {y,m,d}; };
  const isLastFeb = ({y,m,d}) => m===2 && d===new Date(Date.UTC(y,2,0)).getUTCDate();
  function days360(a,b) {
    const A=parse(a),B=parse(b); let d1=A.d,d2=B.d;
    if(isLastFeb(A)&&isLastFeb(B)) d2=30;
    if(isLastFeb(A)) d1=30;
    if(d2===31&&d1>=30) d2=30;
    if(d1===31) d1=30;
    return (B.y-A.y)*360+(B.m-A.m)*30+(d2-d1);
  }
  const daysActual=(a,b)=>(Date.parse(b)-Date.parse(a))/86400000;
  function timeline(pactado,pagos) {
    const map=new Map();
    for(const p of pactado){const r=map.get(p.fecha)||{fecha:p.fecha,D:0,F:0};r.D+=p.valor;map.set(p.fecha,r);}
    for(const p of pagos){const r=map.get(p.fecha)||{fecha:p.fecha,D:0,F:0};r.F+=p.valor;map.set(p.fecha,r);}
    return [...map.values()].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  }
  function liquidacion(pactado,pagos,tasaCia,tasaCliente) {
    const rows=timeline(pactado,pagos); let I=0,J=0,totalH=0;
    rows.forEach((r,k)=>{
      let H=0;
      if(k===0){I=(0<r.F)?0:-r.F;if(I<0)I=0;J=r.D-r.F;}
      else{
        const prev=rows[k-1],rate=J>=0?tasaCliente:tasaCia;
        H=rate*(12*days360(prev.fecha,r.fecha)/360)*J;
        const IH=I+H; let nI,nJ;
        if(IH<0){nI=(IH+r.D)>=0?0:IH+r.D;nJ=(IH+r.D)>=0?J+(IH+r.D)-r.F:J-r.F;}
        else{nI=IH<r.F?0:IH-r.F;nJ=J+r.D-(IH<r.F?r.F-IH:0);}
        I=nI;J=nJ;
      }
      totalH+=H;
    });
    return {ajuste:totalH};
  }
  function vpn(pactado,pagos,tasa) {
    const all=[...pactado,...pagos].map(p=>p.fecha).sort();
    const t0=all[0],tN=all[all.length-1];
    const m=f=>daysActual(t0,f)/(365/12);
    const pv=fl=>fl.reduce((s,p)=>s+p.valor/Math.pow(1+tasa,m(p.fecha)),0);
    const diff=pv(pactado)-pv(pagos);
    return {ajuste:diff*Math.pow(1+tasa,m(tN))};
  }
  function evaluar({pactado,recaudo,propuesta,cfg,valorVenta}) {
    const pagos=[...recaudo,...propuesta]; let ajuste;
    if(cfg.metodo==='liquidacion') ajuste=liquidacion(pactado,pagos,cfg.tasaCia,cfg.tasaCliente).ajuste;
    else ajuste=vpn(pactado,pagos,cfg.tasaVpn).ajuste;
    ajuste=Math.round(ajuste);
    const tope=Math.round(valorVenta*cfg.topePct);
    const topado=ajuste<0&&-ajuste>tope;
    const aplicado=topado?-tope:ajuste;
    const requiereAprobacion=aplicado<0&&-aplicado>valorVenta*cfg.umbralPct;
    return {ajusteCalculado:ajuste,ajuste:aplicado,topado,tope,requiereAprobacion};
  }
  return {days360,evaluar};
})();
</script>

<script>

const iso=d=>d.toISOString().slice(0,10);

const parseNum=s=>{const n=Number(String(s).replace(/[^\d,-]/g,'').replace(',','.'));return isFinite(n)?n:0;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),2200);}
async function copiar(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg);}catch(e){toast('Copia el texto manualmente');}}
const now=new Date();

];
let PROYECTOS=[];
function cuotas(n,desde,dia,valor,concepto='Cuota inicial'){return Array.from({length:n},(_,i)=>({fecha_pp:addM(desde+i,dia),concepto,valor}));}
let NEGOCIOS=[
  {id_venta:2501,proyecto_id:7,inmueble:'T1 - AP-123',cliente_negocio:'FREDY BERNARDO RÍOS SALAZAR',cliente_identificacion:'79456123',correo:'fredy.rios@correo.co',valor_venta:677198000,valor_credito:0,fecha_escrituracion_programada:addM(9,30),

async function cargarNegocios(proyectoId){
  const p=proyecto(proyectoId);if(!p||!p.id_imx)return;
  try{const r=await fetch(`/api/negocios?proyecto_id=${p.id_imx}`);if(!r.ok)return;
    const data=await r.json();
    NEGOCIOS=NEGOCIOS.filter(n=>n.proyecto_id!==proyectoId);
    NEGOCIOS.push(...data.map(n=>({...n,proyecto_id:proyectoId})));
  }catch(e){console.warn('API negocios no disponible',e);}
}
const conceptosDe=pid=>{const c=cfgOf(pid);return[...new Set([...NEGOCIOS.filter(n=>n.proyecto_id===pid).flatMap(n=>n.plan_pagos.map(p=>p.concepto)),c.conceptoAbono,'Cesantias'])];};
const conceptoPrincipal=pid=>{const m={};NEGOCIOS.filter(n=>n.proyecto_id===pid).flatMap(n=>n.plan_pagos).forEach(p=>m[p.concepto]=(m[p.concepto]||0)+1);const e=Object.entries(m).sort((a,b)=>b[1]-a[1]);return e.length?e[0][0]:'Cuota inicial';};

const S={proyectoId:null,negId:null,q:'',solicitudes:[],solActiva:null,view:'asesor'};
try{const s=JSON.parse(localStorage.getItem('replantea.v3')||'null');if(Array.isArray(s))S.solicitudes=s;}catch(e){}
function persist(){try{localStorage.setItem('replantea.v3',JSON.stringify(S.solicitudes));}catch(e){}}
const proyecto=id=>PROYECTOS.find(p=>p.id===id);
const negocio=id=>NEGOCIOS.find(n=>n.id_venta===id);
function cfgOf(pid){return PROYECTOS.find(p=>p.id===pid).cfg;}
const sol=()=>S.solicitudes.find(s=>s.id===S.solActiva);

/* ═══════════════ ANÁLISIS ═══════════════ */
function analizar(n){
  const pactado=n.plan_pagos.map(p=>({fecha:p.fecha_pp,valor:p.valor,concepto:p.concepto}));
  const recaudo=n.recaudo.map(r=>({fecha:r.fecha,valor:r.valor,concepto:r.concepto}));
  let disp=recaudo.reduce((s,r)=>s+r.valor,0);
  const pend=[];
  for(const p of[...pactado].sort((a,b)=>a.fecha.localeCompare(b.fecha))){
    const usado=Math.min(disp,p.valor);disp-=usado;
    const resto=p.valor-usado;
    if(resto>0.5)pend.push({...p,valor:resto,vencida:p.fecha<CORTE});
  }
  const totPact=pactado.reduce((s,p)=>s+p.valor,0);
  const totRec=recaudo.reduce((s,r)=>s+r.valor,0);
  const vencido=pend.filter(p=>p.vencida).reduce((s,p)=>s+p.valor,0);
  const base=pend.map(p=>({fecha:p.vencida?CORTE:p.fecha,valor:p.valor}));
  const tieneInt=n.plan_pagos.some(p=>'int_mora'in p);
  let mora=0;
  if(tieneInt)mora=n.plan_pagos.reduce((s,p)=>{
    const m=p.int_mora||0, a=p.int_aplicado||0;
    if(a===1)return s;          // int_aplicado=1 → condonada por la constructora
    return s+Math.max(0,m-a);  // 0=pendiente, >1=parcialmente cobrada
  },0);
  else{const c=cfgOf(n.proyecto_id);mora=pend.filter(p=>p.vencida).reduce((s,p)=>s+p.valor*c.tasaCliente*Engine.days360(p.fecha,CORTE)/30,0);}
  const fechaLimite=fechaValida(n.fecha_escrituracion_programada)||pactado.map(p=>p.fecha).sort().pop();
  return{pactado,recaudo,pend,base,totPact,totRec,saldo:totPact-totRec,vencido,mora:Math.round(mora),moraReal:tieneInt,fechaLimite};
}

function calc(s){
  const n=negocio(s.negId),a=analizar(n);
  const propuesta=s.propuesta.map(p=>({fecha:p.fecha,valor:p.valor}));
  const totProp=propuesta.reduce((t,p)=>t+p.valor,0);
  const dif=Math.round(a.saldo-totProp);
  const ev=Engine.evaluar({pactado:a.base,recaudo:[],propuesta,cfg:s.cfg,valorVenta:n.valor_venta});
  const checks=[
    {ok:Math.abs(dif)<1,t:Math.abs(dif)<1?'La propuesta cubre el saldo por pagar':(dif>0?`Faltan ${fmt(dif)} por asignar`:`Sobran ${fmt(-dif)}`)},
    {ok:s.propuesta.every(p=>p.fecha>=CORTE),t:'Ninguna cuota con fecha anterior a hoy'},
    {ok:s.propuesta.every(p=>p.fecha<=a.fechaLimite),t:`Todas las cuotas antes del ${fLarga(a.fechaLimite)}`},
    {ok:s.propuesta.every(p=>p.abono||p.valor>=s.cfg.cuotaMin),t:`Cada cuota ≥ ${fmt(s.cfg.cuotaMin)} (salvo abonos)`},
    {ok:s.propuesta.every(p=>p.valor>0),t:'Sin cuotas en cero'}
  ];
  if(ev.topado)checks.push({ok:true,t:`Descuento limitado al tope del proyecto (${pct(s.cfg.topePct)} de la venta)`});
  return{n,a,totProp,dif,ev,checks,valido:checks.every(c=>c.ok)};
}

function rebalancear(s){
  const libres=s.propuesta.filter(p=>!p.fijo).sort((a,b)=>a.fecha.localeCompare(b.fecha));
  if(!libres.length)return;
  const a=analizar(negocio(s.negId));
  const totFijos=s.propuesta.filter(p=>p.fijo).reduce((t,p)=>t+p.valor,0);
  const saldo=a.saldo-totFijos;
  const base=Math.floor(saldo/libres.length);
  for(let i=0;i<libres.length-1;i++)libres[i].valor=base;
  libres[libres.length-1].valor=Math.round(saldo-base*(libres.length-1));
}

/* ═══════════════ SOLICITUDES ═══════════════ */
function encontrarOCrear(n){
  const abierta=S.solicitudes.find(x=>x.negId===n.id_venta&&!['Cargado en IngeMAX','Rechazado'].includes(x.estado));
  if(abierta)return abierta;
  const a=analizar(n);
  const id='SOL-'+String(1001+S.solicitudes.length);
  const token=Array.from(crypto.getRandomValues(new Uint8Array(9)),b=>b.toString(36).padStart(2,'0')).join('').slice(0,14);
  const prop=a.pend.map(p=>({id:nid(),fecha:p.vencida?CORTE:p.fecha,concepto:p.concepto,valor:p.valor,orig:p.valor,origFecha:p.fecha,fijo:false}));
  const sol={id,token,negId:n.id_venta,proyectoId:n.proyecto_id,creada:new Date().toISOString(),estado:'borrador',propuesta:prop,cfg:{...proyecto(n.proyecto_id).cfg}};
  S.solicitudes.unshift(sol);persist();
  return sol;
}

function attachEvents(s,a,n){
  // tabla propuesta: cambios
  const body=$('#bodyProp');
  if(!body)return;
  body.addEventListener('change',e=>{
    const tr=e.target.closest('tr');if(!tr)return;
    const p=s.propuesta.find(x=>x.id===tr.dataset.id);if(!p)return;
    if(e.target.type==='date')p.fecha=e.target.value||p.fecha;
    if(e.target.tagName==='SELECT')p.concepto=e.target.value;
    if(e.target.classList.contains('num')){p.valor=parseNum(e.target.value);p.fijo=true;rebalancear(s);}
    persist();renderPropuesta();
  });
  body.addEventListener('click',e=>{
    const del=e.target.dataset.del;
    if(del){s.propuesta=s.propuesta.filter(p=>p.id!==del);rebalancear(s);persist();renderPropuesta();return;}
    const tog=e.target.dataset.tog;
    if(tog){const p=s.propuesta.find(x=>x.id===tog);if(p){p.fijo=!p.fijo;rebalancear(s);persist();renderPropuesta();}}
  });
  // botones toolbar
  const btnReset=$('#btnReset');
  if(btnReset)btnReset.onclick=()=>{s.propuesta=a.pend.map(p=>({id:nid(),fecha:p.vencida?CORTE:p.fecha,concepto:p.concepto,valor:p.valor,orig:p.valor,origFecha:p.fecha,fijo:false}));persist();renderPropuesta();toast('Plan restablecido');};
  const btnAdd=$('#btnAdd');
  if(btnAdd)btnAdd.onclick=()=>{s.propuesta.push({id:nid(),fecha:addM(1,15),concepto:conceptoPrincipal(s.proyectoId),valor:s.cfg.cuotaMin,fijo:false});rebalancear(s);persist();renderPropuesta();};
  // redistribuir
  const rdTgl=$('#rdTgl'),rdPop=$('#rdPop');
  if(rdTgl&&rdPop){
    rdTgl.onclick=e=>{e.stopPropagation();rdPop.classList.toggle('open');};
    document.addEventListener('click',()=>rdPop.classList.remove('open'),{once:true});
  }
  const rdOk=$('#rdOk');
  if(rdOk)rdOk.onclick=()=>{
    const N=Math.round(parseNum($('#rdN').value)),f=$('#rdF').value;
    if(!(N>0)||!f)return toast('Indica número de cuotas y fecha');
    const fijo=s.propuesta.filter(p=>p.fijo);
    const saldo=a.saldo-fijo.reduce((t,p)=>t+p.valor,0);
    const base=Math.floor(saldo/N);
    const d0=new Date(f+'T00:00:00Z');
    const nuevas=Array.from({length:N},(_,i)=>{const d=new Date(Date.UTC(d0.getUTCFullYear(),d0.getUTCMonth()+i,Math.min(d0.getUTCDate(),28)));return{id:nid(),fecha:iso(d),concepto:conceptoPrincipal(n.proyecto_id),valor:i===N-1?saldo-base*(N-1):base,fijo:false};});
    s.propuesta=[...fijo,...nuevas];persist();renderPropuesta();
    rdPop.classList.remove('open');toast(`Saldo repartido en ${N} cuotas`);
  };
  // generar link
  const btnLink=$('#btnLink');
  if(btnLink)btnLink.onclick=()=>{s.estado='Enviado al comprador';persist();renderPropuesta();toast('Link generado');};
  const btnLink2=$('#btnLink2');
  if(btnLink2)btnLink2.onclick=()=>copiar(`${location.origin}/comprador/${s.token}`,'Link copiado');
  const cpLink=$('#cpLink');
  if(cpLink)cpLink.onclick=()=>copiar(`${location.origin}/comprador/${s.token}`,'Link copiado');
  const goCli=$('#goCli');
  if(goCli)goCli.onclick=()=>{go('cliente-embedded');};
  const goAprob2=$('#goAprob2');
  if(goAprob2)goAprob2.onclick=()=>go('aprob');
  // firma
  const sAcepto=$('#sAcepto');
  if(sAcepto)sAcepto.onchange=()=>{const btn=$('#sEnviar');if(btn)btn.disabled=!sAcepto.checked;};
  let OTP=null;
  const sEnviar=$('#sEnviar');
  if(sEnviar)sEnviar.onclick=()=>{
    OTP=String(Math.floor(100000+Math.random()*900000));
    $('#otpBox').hidden=false;$('#otpMail').textContent=$('#sMail').value;$('#otpDemo').textContent=OTP;
    $('#sOtp').focus();toast('Código enviado (demo)');
  };
  const sFirmar=$('#sFirmar');
  if(sFirmar)sFirmar.onclick=async()=>{
    if($('#sOtp').value.trim()!==OTP)return toast('El código no coincide');
    const {ev}=calc(s);
    const doc={solicitud:s.id,venta:n.id_venta,inmueble:n.inmueble,firmante:$('#sNom').value,documento:$('#sDoc').value,correo:$('#sMail').value,propuesta:[...s.propuesta].sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(p=>[p.fecha,p.concepto,Math.round(p.valor)]),ajuste:ev.ajuste,metodo:s.cfg.metodo,fecha:new Date().toISOString()};
    const hash=await sha256(JSON.stringify(doc));
    s.firma={...doc,hash,ip:'IP registrada por el servidor',agente:navigator.userAgent.slice(0,80)};
    s.ajuste=ev.ajuste;s.ajusteCalculado=ev.ajusteCalculado;s.topado=ev.topado;s.requiereAprobacion=ev.requiereAprobacion;
    s.estado=ev.requiereAprobacion?'Requiere aprobación':'Listo para cargar';
    OTP=null;persist();renderPropuesta();toast('Propuesta firmada');
  };
}

async function sha256(txt){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){let h=0;for(const c of txt)h=(h*31+c.charCodeAt(0))|0;return'fallback-'+(h>>>0).toString(16);}}

/* ═══════════════ ASESOR ═══════════════ */
function renderAsesor(){
  if(!PROYECTOS.length){$('#listaNeg').innerHTML='<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Conectando…</div>';return;}
  const sel=$('#selProyecto');
  sel.innerHTML=PROYECTOS.map(p=>`<option value="${p.id}"${p.id===S.proyectoId?' selected':''}>${esc(p.nombre_proyecto)}</option>`).join('');
  const q=S.q.trim().toLowerCase();
  const negs=NEGOCIOS.filter(n=>n.proyecto_id===S.proyectoId&&(!q||(n.inmueble+n.cliente_negocio+n.cliente_identificacion).toLowerCase().includes(q)));
  if(!negs.find(n=>n.id_venta===S.negId)&&negs[0])S.negId=negs[0].id_venta;
  $('#listaNeg').innerHTML=negs.length?negs.map(n=>{const a=analizar(n);return`<button role="option" data-id="${n.id_venta}" aria-selected="${n.id_venta===S.negId}"><span class="t">${esc(n.inmueble)}</span><span class="chip ${a.vencido>0?'bad':'good'}" style="font-size:10px">${a.vencido>0?'Mora':'Al día'}</span><span class="s">${esc(n.cliente_negocio)}</span></button>`;}).join(''):'<div style="padding:16px;text-align:center;color:var(--muted);font-size:13px">Sin resultados</div>';
  renderNeg();
}

/* ═══════════════ APROBACIÓN ═══════════════ */
const estChip=e=>({'Requiere aprobación':'warn','Listo para cargar':'good','Aprobado':'good','Rechazado':'bad','borrador':'neu','Enviado al comprador':'acc'}[e]??'neu');
function renderAprob(){
  const L=S.solicitudes;
  $('#listaSol').innerHTML=L.length?L.map(s=>{const n=negocio(s.negId);if(!n)return'';return`<button role="option" data-id="${s.id}" aria-selected="${s.id===S.solActiva}"><span class="t">${s.id} · ${esc(n.inmueble)}</span><span class="chip ${estChip(s.estado)}">${esc(s.estado)}</span><span class="s">${esc(n.cliente_negocio)}${s.ajuste!=null?' · '+fmt(s.ajuste):''}</span></button>`;}).join(''):'<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">Sin solicitudes aún</div>';
  const s=sol();const D=$('#detSol');
  if(!s){D.innerHTML='<div class="empty">Selecciona una solicitud</div>';return;}
  const n=negocio(s.negId),a=analizar(n);
  if(!s.firma){D.innerHTML=`<div class="card stack"><div class="small muted">${s.id}</div><h2>${esc(n.inmueble)}</h2><p class="muted small">El comprador aún no ha firmado.</p><button class="btn" id="openCli2">Abrir como comprador</button></div>`;$('#openCli2').onclick=()=>{go('asesor');};return;}
  const plan=[...s.propuesta].sort((x,y)=>x.fecha.localeCompare(y.fecha));
  const fUlt=plan.filter(p=>!p.lock).map(p=>p.fecha).pop()||plan[plan.length-1].fecha;
  const carga=[...plan.map(p=>({concepto:p.concepto,fecha:p.fecha,valor:Math.round(p.valor)})),...(s.ajuste?[{concepto:s.cfg.concepto,fecha:fUlt,valor:s.ajuste,ajuste:true}]:[])];
  const tsv='concepto\tfecha\tvalor\n'+carga.map(c=>`${c.concepto}\t${dmy(c.fecha)}\t${c.valor}`).join('\n');
  const puedeCargar=s.estado==='Listo para cargar'||s.estado==='Aprobado';
  D.innerHTML=`
    <div class="card stack">
      <div class="row between">
        <div><div class="small muted">${s.id} · Venta #${n.id_venta}</div><h2>${esc(n.inmueble)}</h2><div class="small muted">${esc(n.cliente_negocio)} · firmó ${new Date(s.firma.fecha).toLocaleString('es-CO')}</div></div>
        <span class="chip ${estChip(s.estado)}">${esc(s.estado)}</span>
      </div>
      <div class="kpis">
        <div class="kpi"><div class="v" style="color:${s.ajuste<0?'var(--good)':s.ajuste>0?'var(--bad)':'inherit'}">${fmt(s.ajuste)}</div><div class="l">${s.ajuste<=0?'Descuento':'Cargo financiero'}</div></div>
        <div class="kpi"><div class="v">${pct(Math.abs(s.ajuste)/n.valor_venta)}</div><div class="l">% de la venta</div></div>
        <div class="kpi"><div class="v">${pct(s.cfg.topePct)} / ${pct(s.cfg.umbralPct)}</div><div class="l">Tope / umbral gerencia</div></div>
        <div class="kpi"><div class="v" style="font-size:12px">${s.cfg.metodo==='vpn'?'VPN '+pct(s.cfg.tasaVpn)+' M.V.':'Liq. '+pct(s.cfg.tasaCia)+'/'+pct(s.cfg.tasaCliente)}</div><div class="l">Método</div></div>
      </div>
      ${a.mora>0?`<div class="note">Mora causada a hoy: <b>${fmt(a.mora)}</b>. Se gestiona según política de cartera, no hace parte del ajuste.</div>`:''}
      ${s.estado==='Requiere aprobación'?`<div class="row"><button class="btn pri" id="apOk">Aprobar descuento</button><button class="btn" id="apNo">Rechazar</button></div>`:''}
    </div>
    <div class="card stack">
      <div class="row between"><h3>Plan para cargar en IngeMAX</h3><span class="small muted">DD/MM/AAAA</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Concepto</th><th>Fecha</th><th class="n">Valor</th></tr></thead>
        <tbody>
          ${a.recaudo.length?`<tr class="paid"><td colspan="2">Pagos recaudados (${a.recaudo.length}) · sin cambios</td><td class="n">${fmt(a.totRec)}</td></tr>`:''}
          ${carga.map(c=>`<tr${c.ajuste?' style="font-weight:700"':''}><td>${esc(c.concepto)}${c.ajuste?` <span class="chip ${c.valor<0?'good':'bad'}">Ajuste</span>`:''}</td><td class="mono">${dmy(c.fecha)}</td><td class="n">${fmt(c.valor)}</td></tr>`).join('')}
        </tbody>
        <tfoot><tr><td colspan="2">Nuevo valor total</td><td class="n">${fmt(n.valor_venta+s.ajuste)}</td></tr></tfoot>
      </table></div>
      <div class="row">
        <button class="btn" id="cpTsv">Copiar para Excel</button>
        <button class="btn pri" id="mkLoad" ${puedeCargar?'':'disabled'}>Marcar como cargado</button>
      </div>
      <div id="verif"></div>
    </div>
    <div class="card"><div class="small muted" style="margin-bottom:6px">Firma · ${esc(s.firma.firmante)} · ${esc(s.firma.documento)}</div><div class="hash">${s.firma.hash}</div></div>`;
  $('#cpTsv').onclick=()=>copiar(tsv,'Plan copiado');
  if($('#apOk')){$('#apOk').onclick=()=>{s.estado='Aprobado';persist();renderAprob();toast('Descuento aprobado');};$('#apNo').onclick=()=>{s.estado='Rechazado';persist();renderAprob();toast('Rechazado');}}
  $('#mkLoad').onclick=()=>{$('#verif').innerHTML='<div class="note">Verificando contra IngeMAX…</div>';setTimeout(()=>{s.estado='Cargado en IngeMAX';persist();renderAprob();$('#verif').innerHTML='<div class="note" style="color:var(--good)">✓ Verificado. Solicitud cerrada.</div>';},900);};
}

/* ═══════════════ NAVEGACIÓN ═══════════════ */
function go(v){
  if(v==='cliente-embedded')v='asesor'; // comprador abre en mismo panel por ahora
  S.view=v;
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.v===v?'true':'false'));
  document.querySelectorAll('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v));
  render();window.scrollTo(0,0);
}
function render(){
  if(S.view==='asesor')renderAsesor();
  if(S.view==='aprob')renderAprob();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#selProyecto').onchange=async e=>{S.proyectoId=Number(e.target.value);S.negId=null;await cargarNegocios(S.proyectoId);renderAsesor();};
$('#q').oninput=e=>{S.q=e.target.value;renderAsesor();};
$('#listaNeg').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;S.negId=Number(b.dataset.id);renderAsesor();};
$('#listaSol').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;S.solActiva=b.dataset.id;renderAprob();};

/* ═══════════════ INIT ═══════════════ */
async function init(){
  renderAsesor();
  try{
    const r=await fetch('/api/proyectos');
    if(r.ok){
      const data=await r.json();
      const api=data.map(p=>({id:p.id,id_imx:p.id_imx,nombre_proyecto:p.nombre,cfg:{metodo:p.metodo,tasaCia:p.tasa_cia,tasaCliente:p.tasa_cliente,tasaVpn:p.tasa_vpn??0.01,topePct:p.tope_pct,umbralPct:p.umbral_pct,cuotaMin:p.cuota_min,concepto:p.concepto??'Descuento financiero plan de pagos',conceptoAbono:p.concepto_abono??'Recursos Propios'}}));
      PROYECTOS=[...api,...DEMO_PROYECTOS];
      if(api.length){S.proyectoId=api[0].id;await cargarNegocios(S.proyectoId);}
    }
  }catch(e){console.warn('API no disponible, modo demo',e);PROYECTOS=[...DEMO_PROYECTOS];S.proyectoId=DEMO_PROYECTOS[0].id;}
  if(!PROYECTOS.length)PROYECTOS=[...DEMO_PROYECTOS];
  if(!S.proyectoId)S.proyectoId=PROYECTOS[0].id;
  if(!S.solicitudes.length){
    const n=negocio(2501);if(n)encontrarOCrear(n);
  }else{S.solActiva=S.solicitudes[0].id;}
  renderAsesor();
}
init();
</script>
