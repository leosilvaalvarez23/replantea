from django.test import Client
client=Client(enforce_csrf_checks=True)
def api_call(method,path,body,ctype,csrf):
    kw={'HTTP_X_FORWARDED_FOR':'203.0.113.9'}
    if csrf: kw['HTTP_X_CSRFTOKEN']=csrf
    r=client.generic(method,path,data=body or '',content_type=ctype or 'application/octet-stream',**kw)
    return {'status':r.status_code,'body':r.content.decode('utf-8'),'ctype':r.headers.get('Content-Type',''),'cookies':{k:m.value for k,m in client.cookies.items()}}
'listo'

window.E2E={estado:'inicio',calls:[]};
const est=t=>{document.getElementById('estado').textContent=t;E2E.estado=t};
async function arrancar(){
  est('cargando Pyodide…');
  const py=await loadPyodide();
  await py.loadPackage(['micropip','sqlite3','pydantic','tzdata','ssl']);
  est('cargando código…');
  for(const f of FILES){
    const t=await (await fetch('/src/'+f)).text();
    py.FS.mkdirTree(('/app/'+f).split('/').slice(0,-1).join('/'));py.FS.writeFile('/app/'+f,t);
  }
  est('instalando Django…');
  await py.runPythonAsync(`import micropip\nawait micropip.install(['django','django-ninja','whitenoise','httpx'])`);
  est('creando base y datos…');
  await py.runPythonAsync(SETUP);
  const llamar=py.globals.get('api_call');
  window.__apiShim=async(url,opts={})=>{
    const u=new URL(url,location.origin),h=opts.headers||{},m=(opts.method||'GET').toUpperCase();
    const r=llamar(m,u.pathname+u.search,opts.body||null,h['Content-Type']||null,h['X-CSRFToken']||null).toJs({dict_converter:Object.fromEntries});
    for(const [k,v] of Object.entries(r.cookies))document.cookie=`${k}=${v}; path=/`;
    E2E.calls.push(`${m} ${u.pathname} -> ${r.status}`);
    return new Response(r.body,{status:r.status,headers:{'Content-Type':r.ctype}});
  };
  window.py=py;
  est('listo');
}
arrancar().catch(e=>{est('ERROR '+e);console.error(e)});
window.ir=(url)=>new Promise(res=>{const v=document.getElementById('v');v.onload=()=>res();v.src=url});
