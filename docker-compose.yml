services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - IMX_TOKEN=${IMX_TOKEN}
      - DATABASE_URL=postgresql://replantea:${DB_PASSWORD}@db:5432/replantea
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=replantea
      - POSTGRES_USER=replantea
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U replantea"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - internal

networks:
  internal:

volumes:
  pgdata:
  caddy_data:
  caddy_config:
